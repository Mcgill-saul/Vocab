<style>
  :root{
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --surface-2: #ECEEF2;
    --border: #E2E4E9;
    --ink: #14161A;
    --ink-soft: #6B7280;
    --ink-faint: #9CA3AF;
    --accent: #4F46E5;
    --accent-soft: #EEF0FF;
    --accent-deep: #3730A3;
    --danger: #DC4C4C;
    --danger-soft: #FDECEC;
    --success: #16A34A;
    --success-soft: #E8F7EE;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 3px rgba(20,22,26,0.06), 0 1px 2px rgba(20,22,26,0.04);
    --shadow-lg: 0 12px 28px rgba(20,22,26,0.14);

    /* 字号阶梯：全站字号只从这 6 档里选，不再随手写新数值。
       注意 16px 是个例外，没有并进这个阶梯——iOS Safari 有个规则，输入框字号小于
       16px 时聚焦会自动放大整个页面，表单里的 input/textarea/select 必须保持 16px，
       这个不能动，跟这套阶梯是两回事。 */
    --fs-xs: 11px;      /* 徽章/tiny标签：状态标签、词性、底部导航文字、展开箭头 */
    --fs-sm: 13px;      /* 次要小字：说明文字、进度提示、按钮次要文案 */
    --fs-base: 15px;    /* 正文基准：释义、例句、按钮文字 */
    --fs-lg: 17px;      /* 小标题：单词、表单标题、空状态大字 */
    --fs-xl: 22px;      /* 复习卡片背面的单词 */
    --fs-display: 30px; /* 复习卡片正面大字、FAB 加号 */
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header{
    padding-top:env(safe-area-inset-top,0); /* 只处理刘海屏偏移，不参与撑高 */
    padding-left:20px;
    padding-right:20px;
    height:60px; /* 写死高度，不管里面搜索框显示还是隐藏，这一行的高度永远不变 */
    box-sizing:border-box;
    display:flex;
    align-items:center;
    /* 这个 space-between 别删：搜索框(.header-search)靠 flex:1 撑满中间，
       但它 display:none 隐藏时会整个从布局里消失，没有这行的话 logo 和右侧
       设置按钮会一起挤到最左边——之前真的因为漏了这行出过 bug */
    justify-content:space-between;
    gap:10px;
  }
  .header-logo{
    width:26px;
    height:auto;
    flex-shrink:0;
    display:block;
  }
  header .count{
    font-size:var(--fs-sm);
    color:var(--ink-soft);
    flex-shrink:0;
  } /* 单词数量的显示已经拿掉了（header-right 那个位置换成了筛选开关图标），这条样式现在没人用，先留着不删，万一以后想把计数挪到别处显示还能直接复用 */
  .header-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  /* 搜索框做成胶囊形状，居中放在 logo 和设置按钮中间——flex:1 让它自动撑满中间空间，
     两边（logo、计数+设置）宽度固定，视觉上搜索框就成了"正中间"那个 */
  .header-search{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--surface-2);
    border-radius:999px;
    padding:7px 14px;
  }
  .header-search.hidden{ display:none; }
  .header-search .search-icon{ color:var(--ink-faint); flex-shrink:0; display:flex; }
  .header-search .search-icon svg{ width:15px; height:15px; }
  .header-search input{
    border:none;
    outline:none;
    background:transparent;
    flex:1;
    min-width:0;
    font-size:var(--fs-base);
    font-family:inherit;
    color:var(--ink);
  }
  .header-search input::placeholder{ color:var(--ink-faint); } /* 要求"颜色浅一点"，用最淡的那档灰 */

  /* ── 场景筛选行：header 正下方，只在词库页显示（跟搜索框同一套显示规则）。
     三个字段（Context / Domain / Tag）本身就是真正的输入框——点一下直接聚焦、
     直接打字，不需要先点开什么别的东西再输入。平时（没聚焦）灰底胶囊、
     左对齐显示占位符或当前选中值摘要，跟顶部搜索框长得一样。
     一聚焦就展开变宽（.expanded），另外两个让出空间收窄（.shrunk），
     已选的值这时候才以 chip 形式出现在输入框前面，输入框继续打字过滤建议。
     右边固定一个清空按钮，跟设置按钮同款、上下对齐。 */
  .filter-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 20px 10px;
  }
  .filter-row.hidden{ display:none; }
  .filter-row .icon-btn{ flex-shrink:0; }

  .filter-field{
    display:flex;
    align-items:center;
    gap:4px;
    flex:1;
    min-width:0;
    background:var(--surface-2);
    border-radius:999px;
    padding:7px 12px;
    overflow:hidden;
  }
  .filter-field.expanded{ flex:2.4; }
  .filter-field.shrunk{ flex:0.5; }

  .filter-chips{
    display:none; /* 没聚焦时不显示 chip，避免窄列被挤爆；聚焦展开了才出现 */
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
  }
  .filter-field.expanded .filter-chips{ display:flex; }
  .filter-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:var(--fs-sm);
    font-weight:600;
    padding:3px 6px 3px 9px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .filter-chip .chip-remove{ display:flex; cursor:pointer; }
  .filter-chip .chip-remove svg{ width:11px; height:11px; }

  .filter-input{
    flex:1;
    min-width:0;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:var(--fs-sm);
    color:var(--ink);
    text-align:left; /* 跟搜索框的 Search 一样左对齐 */
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .filter-input::placeholder{ color:var(--ink-faint); } /* 没聚焦时占位符=字段名或已选值摘要，浅色 */

  /* ── 建议卡片：贴着筛选行出现在下方，不做全屏变暗遮罩，
     只需要一层透明遮罩接"点外面收起"，保持轻量。
     跟 .fab / .nav-bar 一样的写法：默认 fixed，挂在 #app 下时改成 absolute，
     这样才能按 #app 这个 480px 宽的容器定位，不会跑到真实视口的边缘去。 */
  .filter-popover-overlay{
    position:fixed; inset:0;
    background:transparent;
    z-index:16;
    display:none;
  }
  .filter-popover-overlay.show{ display:block; }
  #app > .filter-popover-overlay{ position:absolute; }
  .filter-popover{
    position:fixed;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
    padding:6px;
    max-height:240px;
    overflow-y:auto;
    z-index:17;
    display:none;
  }
  .filter-popover.show{ display:block; }
  #app > .filter-popover{ position:absolute; }
  .filter-option{
    padding:10px 10px;
    border-radius:var(--radius-sm);
    font-size:var(--fs-sm);
    color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    cursor:pointer;
  }
  .filter-option:active{ background:var(--surface-2); }
  .filter-popover .fo-empty{
    padding:18px 8px;
    text-align:center;
    color:var(--ink-faint);
    font-size:var(--fs-sm);
  }

  .icon-btn{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn:active{ background:var(--surface-2); }
  /* 筛选开关图标：收起状态下也要能看出"现在是不是筛着东西"，有筛选生效就换成强调色 */
  #filterToggleBtn.active{ color:var(--accent); border-color:var(--accent); }

  .backup-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .backup-row:last-child{ border-bottom:none; }
  .backup-row .bk-icon{
    width:38px; height:38px;
    border-radius:11px;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .backup-row .bk-icon svg{ width:19px; height:19px; }
  .backup-row .bk-text .bk-title{ font-size:var(--fs-base); font-weight:700; }
  .backup-row .bk-text .bk-desc{ font-size:var(--fs-sm); color:var(--ink-soft); margin-top:2px; }
  .backup-stats{
    background:var(--surface-2);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-size:var(--fs-sm);
    line-height:1.9;
    margin:14px 0;
  }
  .gist-status-neutral{ color:var(--ink-faint); }
  .gist-status-ok{ color:var(--success); font-weight:600; }
  .gist-status-error{ color:var(--danger); font-weight:600; }
  .conflict-banner{
    position:fixed;
    left:50%; bottom:24px;
    transform:translateX(-50%);
    z-index:40;
    background:var(--surface);
    border:1px solid var(--accent);
    border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
    padding:14px 16px;
    max-width:340px;
    width:calc(100% - 32px);
    font-size:var(--fs-sm);
    line-height:1.6;
    color:var(--ink);
  }
  main{
    flex:1;
    padding:4px 16px 100px;
    overflow-y:auto;
  }

  /* ── 单词列表 ── */
  .word-card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    touch-action:pan-y; /* 让JS接管左右滑动，同时不影响页面上下滚动 */
  }
  .word-card.swipe-mastered{ background:var(--success-soft); }
  .word-card.swipe-revert{ background:var(--surface-2); }
  .entry-row1{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .entry-row1 .word{
    font-size:var(--fs-lg);
    font-weight:700;
    letter-spacing:-0.01em;
    flex-shrink:0;
  }
  .entry-row1 .pos{
    font-size:var(--fs-xs);
    color:var(--accent);
    background:var(--accent-soft);
    padding:1px 7px;
    border-radius:20px;
    font-weight:600;
    flex-shrink:0;
  }
  .status-badge{
    font-size:var(--fs-xs);
    font-weight:700;
    padding:1px 7px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .status-badge.mastered{ background:var(--success-soft); color:var(--success); }
  .status-badge.learning{ background:var(--surface-2); color:var(--ink-faint); }
  .meaning-inline{
    flex:1;
    min-width:0;
    font-size:var(--fs-base);
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis; /* 释义太长就省略号截断，换来单词行不再单独占一行 */
  }
  .meaning-inline.masked{
    color:var(--ink-faint);
    letter-spacing:2px;
    cursor:pointer;
  }
  .meaning-inline.revealed{
    cursor:pointer;
  }
  .word-card .example{
    font-size:var(--fs-sm);
    color:var(--ink-faint);
    margin-top:7px;
    padding-top:7px;
    border-top:1px solid var(--border);
    line-height:1.5;
  }
  .word-card .example.clickable{ cursor:pointer; }

  .empty-state{
    text-align:center;
    color:var(--ink-faint);
    padding:80px 24px 40px;
    font-size:var(--fs-base);
    line-height:1.7;
  }
  .empty-state .big{
    font-size:var(--fs-lg);
    font-weight:700;
    color:var(--ink);
    margin-bottom:6px;
  }

  /* ── FAB ── */
  .fab{
    position:fixed;
    right:20px;
    bottom:calc(78px + env(safe-area-inset-bottom,0)); /* 抬高到底部导航栏上方 */
    width:56px;height:56px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    border:none;
    font-size:var(--fs-display);
    line-height:1;
    box-shadow:var(--shadow-lg);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:15;
  }
  .fab:active{ background:var(--accent-deep); }
  #app > .fab{
    position:absolute;
  }

  /* ── 底部导航栏 ── */
  .nav-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom,0);
    z-index:14;
  }
  #app > .nav-bar{ position:absolute; }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    padding:10px 4px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-family:inherit;
    font-size:var(--fs-xs);
    color:var(--ink-faint);
    cursor:pointer;
  }
  .nav-btn .nav-icon{ display:flex; align-items:center; justify-content:center; }
  .nav-btn .nav-icon svg{ width:20px; height:20px; }
  .nav-btn.active{ color:var(--accent); font-weight:700; }

  /* ── Bottom sheet ── */
  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(20,22,26,0.4);
    opacity:0; pointer-events:none;
    transition:opacity .2s;
    z-index:20;
  }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom,0));
    max-height:88vh;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
    z-index:21;
    box-shadow:0 -8px 30px rgba(20,22,26,0.12);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px;
    background:var(--border);
    border-radius:4px;
    margin:6px auto 14px;
  }
  .sheet-title{
    font-size:var(--fs-lg);
    font-weight:700;
    margin-bottom:16px;
  }
  .sheet-back{
    display:flex; align-items:center; gap:2px;
    background:none; border:none;
    color:var(--ink-soft);
    font-size:var(--fs-base); font-weight:600;
    font-family:inherit;
    padding:2px 0 14px;
    cursor:pointer;
  }
  .sheet-back svg{ width:16px; height:16px; }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:var(--fs-sm);
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input, .field textarea, .field select{
    width:100%;
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    background:var(--surface);
    padding:11px 12px;
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-color:var(--accent);
  }
  .field textarea{ min-height:64px; resize:vertical; line-height:1.5; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }

  /* 自定义下拉箭头：去掉浏览器原生那个三角（各家系统长得不一样，风格也旧），
     换成跟其他图标一致的线条 chevron */
  .select-wrap{ position:relative; }
  .select-wrap select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    padding-right:34px; /* 给右边的箭头图标留位置，不然文字会被挡住 */
  }
  .select-wrap .select-arrow{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--ink-faint);
    pointer-events:none; /* 图标只是装饰，点击要穿透到下面的 select 上 */
    display:flex;
  }
  .select-wrap .select-arrow svg{ width:14px; height:14px; }

  .more-toggle{
    background:none; border:none; padding:6px 0 14px;
    font-size:var(--fs-sm); color:var(--accent); font-weight:600;
    font-family:inherit; cursor:pointer;
    display:flex; align-items:center; gap:5px;
  }
  .more-toggle .arrow{ font-size:var(--fs-lg); transition:transform .15s; }
  .more-toggle.open .arrow{ transform:rotate(90deg); }
  .more-fields{ display:none; flex-direction:column; }
  .more-fields.open{ display:flex; }

  .sheet-actions{
    display:flex; gap:10px; margin-top:6px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:var(--radius-sm);
    padding:13px;
    font-family:inherit;
    font-size:var(--fs-base);
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:active{ background:var(--accent-deep); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); flex:none; padding:13px 18px; }

  /* ── 复习：模式切换 ── */
  .review-mode-toggle{
    display:flex; gap:8px;
    margin:6px 0 16px;
  }
  .mode-btn{
    flex:1;
    padding:9px 10px;
    border-radius:20px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:var(--fs-sm);
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .mode-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .review-progress{
    font-size:var(--fs-sm);
    color:var(--ink-faint);
    margin-bottom:10px;
  }

  /* ── 复习卡片 ── */
  @keyframes cardFlipIn{
    from{ transform:scaleX(0.9) rotateY(8deg); opacity:0.3; }
    to{ transform:scaleX(1) rotateY(0deg); opacity:1; }
  }
  .review-card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    min-height:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 22px;
    text-align:center;
    cursor:pointer;
    animation:cardFlipIn .28s cubic-bezier(.2,.8,.2,1);
    transform-origin:center;
  }
  .review-card:active{ transform:scale(0.98); }
  .review-card .rc-word{
    font-size:var(--fs-display);
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .review-card .rc-phonetic{
    font-size:var(--fs-base);
    color:var(--ink-faint);
    margin-top:6px;
  }
  .review-card .rc-hint{
    margin-top:20px;
    font-size:var(--fs-sm);
    color:var(--ink-faint);
  }
  .review-card.flipped{
    align-items:stretch;
    text-align:left;
    cursor:default;
    padding:22px;
  }
  .review-card .rc-back-word{
    font-size:var(--fs-xl);
    font-weight:800;
  }
  .review-card .rc-meaning{
    color:var(--accent);
    font-size:var(--fs-base);
    font-weight:600;
    margin-top:6px;
  }
  .review-card .rc-example{
    border-top:1px solid var(--border);
    margin-top:14px;
    padding-top:12px;
    font-size:var(--fs-sm);
    line-height:1.6;
    color:var(--ink-soft);
  }

  .review-actions{ display:flex; gap:10px; margin-top:16px; }
  .review-actions button{
    flex:1; border:none; border-radius:var(--radius-sm);
    padding:14px 10px; font-family:inherit; font-size:var(--fs-base); font-weight:700; cursor:pointer;
  }
  .btn-forgot{ background:var(--danger-soft); color:var(--danger); }
  .btn-known{ background:var(--accent); color:#fff; }

  .toast{
    position:fixed;
    bottom:30px; left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:var(--fs-sm);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:30;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="header-logo" viewBox="182 185 318 305" xmlns="http://www.w3.org/2000/svg" aria-label="Grain">
      <polygon points="192,195 246,195 302,480 248,480" fill="#4285F4"/>
      <polygon points="248,480 302,480 368,195 314,195" fill="#EA4335"/>
      <polygon points="314,195 368,195 434,480 380,480" fill="#FBBC05"/>
      <polygon points="380,480 434,480 490,195 436,195" fill="#34A853"/>
    </svg>
    <div class="header-search" id="headerSearch">
      <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input id="listSearchInput" placeholder="Search" autocomplete="off">
    </div>
    <div class="header-right">
      <button class="icon-btn" id="filterToggleBtn" aria-label="筛选"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="备份设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <div class="filter-row" id="filterRow">
    <div class="filter-field" id="filterFieldScene" data-field="scene">
      <div class="filter-chips" id="filterChipsScene"></div>
      <input type="text" class="filter-input" id="filterInputScene" placeholder="Context" autocomplete="off">
    </div>
    <div class="filter-field" id="filterFieldDomain" data-field="domain">
      <div class="filter-chips" id="filterChipsDomain"></div>
      <input type="text" class="filter-input" id="filterInputDomain" placeholder="Domain" autocomplete="off">
    </div>
    <div class="filter-field" id="filterFieldTag" data-field="tag">
      <div class="filter-chips" id="filterChipsTag"></div>
      <input type="text" class="filter-input" id="filterInputTag" placeholder="Tag" autocomplete="off">
    </div>
    <button class="icon-btn" id="filterResetBtn" aria-label="清空筛选"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
  </div>

  <main id="main"></main>

  <nav class="nav-bar">
    <button class="nav-btn" data-tab="list"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg></span><span>Words</span></button>
    <button class="nav-btn" data-tab="review"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span><span>Review</span></button>
  </nav>

  <button class="fab" id="fabAdd">+</button>

  <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">

  <div class="filter-popover-overlay" id="filterPopoverOverlay"></div>
  <div class="filter-popover" id="filterPopover"></div>

  <div class="sheet-overlay" id="backupOverlay"></div>
  <div class="sheet" id="backupSheet">
    <div class="sheet-handle"></div>
    <div id="backupBody"></div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Add Word</div>

    <div class="field"><label>Word *</label><input id="fWord" autocomplete="off" autocapitalize="off"></div>
    <div class="field"><label>Meaning *</label><input id="fMeaning" autocomplete="off"></div>
    <div class="field"><label>Example</label><textarea id="fExample"></textarea></div>

    <button type="button" class="more-toggle" id="moreToggle">
      <span class="arrow">▸</span><span>More (Phonetic / POS / Tag…)</span>
    </button>
    <div class="more-fields" id="moreFields">
      <div class="field-row">
        <div class="field"><label>Phonetic</label><input id="fPhonetic" autocomplete="off"></div>
        <div class="field"><label>Part of Speech</label><input id="fPos" list="posOptions" autocomplete="off"></div>
        <datalist id="posOptions"></datalist>
      </div>
      <div class="field"><label>Translation</label><textarea id="fExampleZh"></textarea></div>
      <div class="field"><label>Tag</label><input id="fTag" autocomplete="off"></div>
      <div class="field-row">
        <div class="field"><label>Context</label><input id="fScene" autocomplete="off"></div>
        <div class="field"><label>Domain</label><input id="fDomain" autocomplete="off"></div>
      </div>
      <div class="field"><label>Related Words</label><input id="fRelated" autocomplete="off"></div>
      <div class="field-row">
        <div class="field">
          <label>Status</label>
          <div class="select-wrap">
            <select id="fStatus">
              <option value="1">Learning</option>
              <option value="2">Mastered</option>
            </select>
            <span class="select-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
          </div>
        </div>
        <div class="field"><label>Date Added</label><input id="fDate" type="date"></div>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">Delete</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/*
 * 命名空间约定：所有状态/逻辑/渲染都挂在 App 下面，不在顶层再声明裸变量/函数。
 *   App.config   —— 常量配置
 *   App.state    —— 运行时状态
 *   App.storage  —— 读写 localStorage
 *   App.render   —— 渲染函数
 *   App.utils    —— 工具函数
 * 调试时控制台可以直接用 App.state.words 查看数据。
 */
const App = {

  config: {
    STORAGE_KEY: 'words-v2-data',
    REVIEW_MODE_KEY: 'words-v2-review-mode',
    // 间隔重复：盒子编号对应的复习间隔天数，答对了盒子往上升、间隔拉长；答错了打回盒0
    SR_DAY: 24 * 60 * 60 * 1000,
    SR_INTERVALS: [0, 1, 2, 4, 7, 15],
    get SR_MAX_BOX(){ return this.SR_INTERVALS.length - 1; }
  },

  state: {
    words: [],
    editingId: null,
    currentTab: 'list', // 'list' 词库 | 'review' 复习
    searchQuery: '',
    // 场景筛选：tag/scene/domain 各自选中的值（数组）。组内"或"、组间"且"；
    // 空数组表示该组没有筛选，不参与限制。跟搜索一样是临时状态，不存库，刷新页面就清空。
    sceneFilter: { tag: [], scene: [], domain: [] },
    filterRowExpanded: false, // 筛选行是否展开（点 header 上的三横线图标切换），默认收起，减少常驻占用的视觉空间
    activeField: null, // 当前聚焦的筛选输入框对应字段（'scene'/'domain'/'tag'），没聚焦是 null
    editQuery: '', // 聚焦状态下当前打的字，用来过滤建议列表
    reviewDueOnly: true,  // true=只看今日到期 false=全部单词
    reviewQueue: [],
    reviewIndex: 0,
    reviewFlipped: false
  },

  dom: {},

  storage: {
    load(){
      try{
        const raw = localStorage.getItem(App.config.STORAGE_KEY);
        App.state.words = raw ? JSON.parse(raw) : [];
      }catch(e){
        App.state.words = [];
        App.utils.toast('本地数据读取失败');
      }
      // 防御性迁移：万一以后从别处导入数据、缺 box/nextReview 字段，这里补上，
      // 不然复习功能会因为 undefined 报错
      let migrated = false;
      App.state.words.forEach(w=>{
        if(typeof w.box !== 'number' || !w.nextReview){
          w.box = 0;
          w.nextReview = Date.now();
          migrated = true;
        }
      });
      if(migrated) App.storage.save();
    },
    save(opts){
      try{
        localStorage.setItem(App.config.STORAGE_KEY, JSON.stringify(App.state.words));
        if(!(opts && opts.skipAutoPush)) App.gist.scheduleAutoPush();
      }catch(e){
        App.utils.toast('保存失败，存储空间可能已满');
      }
    }
  },

  utils: {
    uid(){ return 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); },
    escapeHtml(str){
      return String(str || '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    },
    toast(msg){
      const el = App.dom.toast;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(App.utils._toastTimer);
      App.utils._toastTimer = setTimeout(()=>el.classList.remove('show'), 1600);
    },
    // 用线条 SVG 换掉 emoji：emoji 不吃 currentColor，换设备/字体样子还不一样，
    // 跟我们特地调的靛蓝配色系统脱节。这些图标统一用 stroke="currentColor"，
    // 套在什么颜色的容器里就跟着变什么颜色。
    icons: {

      chevronLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'

  render: {
    main(){
      App.render.syncNav();
      App.render.syncHeaderSearch();
      App.render.syncFilterRow();
      const S = App.state;
      if(S.currentTab === 'review') App.render.review();
      else App.render.list();
    },

    syncNav(){
      const S = App.state;
      document.querySelectorAll('.nav-btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.tab === S.currentTab);
      });
    },

    // 搜索框常驻在 header 里，只在词库页显示；切到复习页就藏起来。
    // 跟 syncNav 一样，得在"直接调 review.start() 跳过 render.main()"的路径上也手动调一次，
    // 不然从词库切到复习，搜索框不会跟着消失（这个坑我们在 nav 高亮上已经踩过一次了）。
    syncHeaderSearch(){
      App.dom.headerSearch.classList.toggle('hidden', App.state.currentTab !== 'list');
    },

    // 场景筛选行：只在词库页 + 用户点开了筛选开关时才显示（两个条件都要满足）；
    // 开关图标本身也要跟着"当前是否有筛选生效"变个颜色，收起来的时候也能看出还筛着东西。
    // 同时把没在聚焦编辑中的字段刷新成"占位符/已选值摘要"这个展示态——凡是会改变
    // 筛选结果的地方（切 tab、开关筛选行、清空筛选）都要调它。正在编辑的字段跳过，
    // 不然会把用户正在打的字冲掉。
    syncFilterRow(){
      const show = App.state.currentTab === 'list' && App.state.filterRowExpanded;
      App.dom.filterRow.classList.toggle('hidden', !show);
      App.dom.filterToggleBtn.classList.toggle('active', App.filter.FIELDS.some(App.filter.isActive));
      App.filter.FIELDS.forEach(field=>{
        if(App.state.activeField !== field) App.filter._syncCollapsedDisplay(field);
      });
    },

    list(){
      const S = App.state;
      const $main = App.dom.main;

      if(S.words.length === 0){
        $main.innerHTML = `<div class="empty-state">
          <div class="big">还没有单词</div>
          <div>点右下角 "+" 添加第一个吧</div>
        </div>`;
        return;
      }

      // 搜索结果容器只在第一次进列表页时创建一次，之后每次打字只重画这里面的内容——
      // 搜索框本身在 header 里是常驻的，不会因为切换 tab 或打字而被重建，不用担心丢焦点
      if(!document.getElementById('listResults')){
        $main.innerHTML = `<div id="listResults"></div>`;
      }
      App.render._renderListResults();
    },

    _renderListResults(){
      const S = App.state;
      const esc = App.utils.escapeHtml;
      const container = document.getElementById('listResults');
      if(!container) return;

      const q = (S.searchQuery || '').trim().toLowerCase();
      let list = S.words.slice().sort((a,b)=>b.createdAt - a.createdAt);
      list = list.filter(App.filter.matches); // 场景筛选（tag/scene/domain），没选任何值时 matches 对谁都返回 true
      if(q){
        // 只匹配单词和释义这两个最常用的字段，例句/标签这些先不搜——
        // 真有需要以后再加，不然默认搜索范围太宽，结果反而不精准
        list = list.filter(w =>
          (w.word || '').toLowerCase().includes(q) ||
          (w.meaning || '').toLowerCase().includes(q)
        );
      }

      if(list.length === 0){
        container.innerHTML = `<div class="empty-state">没有匹配的单词</div>`;
        return;
      }

      container.innerHTML = list.map(App.render._wordCard).join('');

      container.querySelectorAll('.word-card').forEach(card=>{
        card.onclick = ()=>{
          if(App.list._justSwiped) return;
          App.sheet.openEdit(card.dataset.id);
        };
        App.list.bindSwipe(card);
      });

      // masked/revealed（释义）、clickable（例句释义）共用同一个"有没有看过"的开关逻辑，
      // 用不同的 key 前缀区分（单词本身的 id vs 'ex_'+id），互不冲突
      container.querySelectorAll('.meaning-inline.masked, .meaning-inline.revealed, .example.clickable').forEach(el=>{
        el.onclick = (e)=>{
          e.stopPropagation(); // 别让这次点击也顺带打开编辑表单
          const id = el.dataset.revealId;
          if(App.list.revealedIds.has(id)) App.list.revealedIds.delete(id);
          else App.list.revealedIds.add(id);
          App.render._renderListResults();
        };
      });
    },

    // 每个单词一张独立卡片——同一个单词的不同词性/释义就是各自独立的两张卡片，
    // 不做分组：它们本来就是两个独立的记忆点（各自的复习进度），视觉上没必要强行绑在一起。
    _wordCard(w){
      const esc = App.utils.escapeHtml;
      const mastered = w.status === 2;
      const showMasked = mastered && !App.list.revealedIds.has(w.id);
      let meaningHtml;
      if(showMasked){
        meaningHtml = `<span class="meaning-inline masked" data-reveal-id="${w.id}">••••</span>`;
      } else if(mastered){
        // 已掌握但当前是"临时展开"状态：点一下应该能再盖回去，不是看过一次就永远亮着
        meaningHtml = `<span class="meaning-inline revealed" data-reveal-id="${w.id}">${esc(w.meaning)}</span>`;
      } else {
        meaningHtml = `<span class="meaning-inline">${esc(w.meaning)}</span>`;
      }

      // 例句的中文释义默认不展示，点例句区域切换显示/隐藏（跟释义遮盖是各自独立的开关）
      let exampleHtml = '';
      if(w.example){
        const exKey = 'ex_' + w.id;
        const zhRevealed = App.list.revealedIds.has(exKey);
        if(w.exampleZh){
          exampleHtml = `<div class="example clickable" data-reveal-id="${exKey}">${esc(w.example)}${zhRevealed ? '<br>' + esc(w.exampleZh) : ''}</div>`;
        } else {
          exampleHtml = `<div class="example">${esc(w.example)}</div>`;
        }
      }

      return `<div class="word-card" data-id="${w.id}">
        <div class="entry-row1">
          <span class="word">${esc(w.word)}</span>
          ${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ''}
          ${meaningHtml}
          <span class="status-badge ${mastered ? 'mastered' : 'learning'}">${mastered ? 'Mastered' : 'Learning'}</span>
        </div>
        ${exampleHtml}
      </div>`;
    },

    // 复习页面：只负责把 state.reviewQueue/reviewIndex/reviewFlipped 画出来，
    // 不在这里重建队列——重建队列的活由 App.review.start() 做
    review(){
      const S = App.state;
      const $main = App.dom.main;
      const esc = App.utils.escapeHtml;

      const modeToggleHtml = `<div class="review-mode-toggle">
        <button class="mode-btn ${S.reviewDueOnly ? 'active':''}" id="modeDueBtn">Due Today</button>
        <button class="mode-btn ${!S.reviewDueOnly ? 'active':''}" id="modeAllBtn">All Words</button>
      </div>`;

      if(S.words.length === 0){
        $main.innerHTML = modeToggleHtml + `<div class="empty-state">
          <div class="big">词库还是空的</div>
          <div>先去"词库"添加几个单词吧</div>
        </div>`;
        App.render._bindModeButtons();
        return;
      }

      if(S.reviewQueue.length === 0){
        if(S.reviewDueOnly){
          $main.innerHTML = modeToggleHtml + `<div class="empty-state">
            <div class="big">今天要复习的都完成啦</div>
            <div>可以点上面切到"全部单词"提前复习</div>
          </div>`;
        } else {
          $main.innerHTML = modeToggleHtml + `<div class="empty-state">
            <div class="big">暂无单词</div>
          </div>`;
        }
        App.render._bindModeButtons();
        return;
      }

      if(S.reviewIndex >= S.reviewQueue.length){
        $main.innerHTML = modeToggleHtml + `<div class="empty-state">
          <div class="big">本轮复习完成！</div>
          <div>共复习了 ${S.reviewQueue.length} 个单词</div>
        </div>
        <button class="btn btn-primary" id="reviewAgainBtn" style="margin-top:14px;">再来一轮</button>`;
        App.render._bindModeButtons();
        document.getElementById('reviewAgainBtn').onclick = ()=>App.review.start(S.reviewDueOnly);
        return;
      }

      const w = S.reviewQueue[S.reviewIndex];
      let cardHtml;
      if(!S.reviewFlipped){
        cardHtml = `<div class="review-card" id="reviewCard">
          <div class="rc-word">${esc(w.word)}</div>
          ${w.phonetic ? `<div class="rc-phonetic">${esc(w.phonetic)}</div>` : ''}
          <div class="rc-hint">点击卡片查看释义</div>
        </div>`;
      } else {
        cardHtml = `<div class="review-card flipped" id="reviewCard">
          <div class="rc-back-word">${esc(w.word)}${w.phonetic ? ` <span class="rc-phonetic">${esc(w.phonetic)}</span>` : ''}</div>
          <div class="rc-meaning">${esc(w.meaning)}</div>
          ${w.example ? `<div class="rc-example">${esc(w.example)}${w.exampleZh ? '<br>' + esc(w.exampleZh) : ''}</div>` : ''}
        </div>
        <div class="review-actions">
          <button class="btn-forgot" id="btnForgot">Again</button>
          <button class="btn-known" id="btnKnown">Got it</button>
        </div>`;
      }

      $main.innerHTML = modeToggleHtml +
        `<div class="review-progress">复习中 ${S.reviewIndex + 1} / ${S.reviewQueue.length}</div>` +
        cardHtml;

      App.render._bindModeButtons();
      if(!S.reviewFlipped){
        document.getElementById('reviewCard').onclick = ()=>{
          S.reviewFlipped = true;
          App.render.review();
        };
      } else {
        document.getElementById('btnForgot').onclick = ()=>App.review.grade(false);
        document.getElementById('btnKnown').onclick = ()=>App.review.grade(true);
      }
    },

    _bindModeButtons(){
      const dueBtn = document.getElementById('modeDueBtn');
      const allBtn = document.getElementById('modeAllBtn');
      if(dueBtn) dueBtn.onclick = ()=>App.review.setMode(true);
      if(allBtn) allBtn.onclick = ()=>App.review.setMode(false);
    }
  },

  // 词库列表的两个手势小功能：
  //   1. 左滑卡片：在"学习中"和"已掌握"之间切换（再滑一次滑回去）
  //   2. 已掌握的词，释义默认用圆点遮住，点一下才显示——把翻列表变成一次被动回忆测验
  list: {
    revealedIds: new Set(), // 本次打开 App 期间，手动点开看过释义的已掌握单词，不存库，纯临时状态
    _justSwiped: false,     // 滑动刚结束的短暂窗口内，屏蔽紧跟着触发的点击（避免滑完顺带被当成点击打开编辑）
    _swipe: { active:false, id:null, startX:0, startY:0, curX:0, swiping:false, moved:false },

    bindSwipe(card){
      const THRESHOLD = 70;
      const id = card.dataset.id;

      card.addEventListener('touchstart', e=>{
        const s = App.list._swipe;
        s.active = true; s.id = id;
        s.startX = s.curX = e.touches[0].clientX;
        s.startY = e.touches[0].clientY;
        s.swiping = false; s.moved = false;
        card.style.transition = 'none';
      }, { passive:true });

      card.addEventListener('touchmove', e=>{
        const s = App.list._swipe;
        if(!s.active || s.id !== id) return;
        s.curX = e.touches[0].clientX;
        const dx = s.curX - s.startX;
        const dy = e.touches[0].clientY - s.startY;
        if(!s.swiping){
          // 判断这次触摸是"横向滑动"还是"纵向滚动"：横向位移明显更大才当成滑动手势处理，
          // 纵向位移先出现就直接放弃，让浏览器正常滚动页面（不然会跟上下滑动打架）
          if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) s.swiping = true;
          else if(Math.abs(dy) > 10){ s.active = false; return; }
        }
        if(s.swiping && dx < 0){
          s.moved = true;
          const clamped = Math.max(dx, -100);
          card.style.transform = `translateX(${clamped}px)`;
          const w = App.state.words.find(x=>x.id === id);
          const willBecomeMastered = w && w.status !== 2;
          const ready = clamped <= -THRESHOLD;
          card.classList.toggle('swipe-mastered', ready && willBecomeMastered);
          card.classList.toggle('swipe-revert', ready && !willBecomeMastered);
        }
      }, { passive:true });

      card.addEventListener('touchend', ()=>{
        const s = App.list._swipe;
        if(!s.active || s.id !== id) return;
        const dx = s.curX - s.startX;
        card.style.transition = 'transform 0.2s ease';
        card.style.transform = '';
        card.classList.remove('swipe-mastered', 'swipe-revert');
        if(s.swiping && s.moved && dx <= -THRESHOLD){
          App.list._justSwiped = true;
          setTimeout(()=>{ App.list._justSwiped = false; }, 300);
          App.list.toggleMastered(id);
        }
        s.active = false; s.swiping = false; s.moved = false;
      });
    },

    toggleMastered(id){
      const w = App.state.words.find(x=>x.id === id);
      if(!w) return;
      w.status = (w.status === 2) ? 1 : 2;
      App.storage.save();
      App.render.list();
    }
  },

  // 场景筛选：按 tag/scene/domain 三个字段筛词库列表。
  //   - 组内（同一字段选了好几个值）是"或"——命中任一选中值就算
  //   - 组间（tag/scene/domain 互相之间）是"且"——每个"有选中值"的组都必须命中，
  //     没选任何值的组不参与限制（比如只选了 scene，tag/domain 就完全不筛）
  // 现在只接在"浏览词库列表"上，不影响复习抽词——先把这个用顺了，以后要不要接进复习环节再说。
  // 选中状态是临时的（不存库），跟 searchQuery 一个待遇，刷新页面就清空。
  filter: {
    FIELDS: ['scene', 'domain', 'tag'], // 展示顺序：Context 最常用排第一，Domain 第二，Tag 最少用排最后
    LABELS: { tag: 'Tag', scene: 'Context', domain: 'Domain' },

    // 从当前词库数据里收集某个字段出现过的去重值，不额外维护固定列表——
    // 谁标过什么值，建议列表里就出现什么，标签值本身的规范与否是用户自己的事
    getValues(field){
      const set = new Set();
      App.state.words.forEach(w=>{
        const v = (w[field] || '').trim();
        if(v) set.add(v);
      });
      return Array.from(set).sort((a,b)=>a.localeCompare(b, 'zh'));
    },

    isActive(field){ return App.state.sceneFilter[field].length > 0; },

    matches(w){
      return App.filter.FIELDS.every(field=>{
        const selected = App.state.sceneFilter[field];
        if(selected.length === 0) return true; // 这组没选，不限制
        return selected.includes((w[field] || '').trim());
      });
    },

    // 没聚焦时输入框用占位符显示的文字：没选就是字段名本身；选了 1 个就直接显示那个值；
    // 选了多个就"第一个值 +N"，避免多个值堆在一个很窄的输入框里挤成一团
    pillLabel(field){
      const selected = App.state.sceneFilter[field];
      if(selected.length === 0) return App.filter.LABELS[field];
      if(selected.length === 1) return selected[0];
      return `${selected[0]} +${selected.length - 1}`;
    },

    _cap(field){ return field.charAt(0).toUpperCase() + field.slice(1); },
    // 三个字段对应的三组 DOM 节点，id 都是按 filterField/filterChips/filterInput + 首字母大写字段名 拼出来的
    _els(field){
      const c = App.filter._cap(field);
      return {
        field: App.dom['filterField' + c],
        chips: App.dom['filterChips' + c],
        input: App.dom['filterInput' + c]
      };
    },

    reset(){
      App.filter.FIELDS.forEach(f=>{ App.state.sceneFilter[f] = []; });
      App.render._renderListResults();
      App.filter.collapseActive();
      App.filter.FIELDS.forEach(f=>App.filter._syncCollapsedDisplay(f));
    },

    collapseActive(){
      if(App.state.activeField) App.filter._collapse(App.state.activeField);
    },

    // 输入框原生 focus 触发——点一下就是真正聚焦输入，键盘直接弹出来，不需要先点开
    // 别的东西再手动 focus（这正是之前那版"要点两次才能打字"的问题根源）。
    // 聚焦的字段展开变宽，另外两个收窄让位；已选的值这时候才渲染成 chip 显示出来。
    _expand(field){
      App.state.activeField = field;
      App.state.editQuery = '';
      App.filter.FIELDS.forEach(f=>{
        const els = App.filter._els(f);
        if(f === field){
          els.field.classList.add('expanded');
          els.field.classList.remove('shrunk');
        } else {
          els.field.classList.add('shrunk');
          els.field.classList.remove('expanded');
        }
      });
      App.filter._renderChips(field);
      App.filter._renderSuggestions(field);
      App.filter._position();
      App.dom.filterPopover.classList.add('show');
      App.dom.filterPopoverOverlay.classList.add('show');
    },

    // 输入框原生 blur 触发（点其他地方、点建议列表都算——建议卡片上挡了 mousedown
    // 默认行为，所以点建议项不会先把输入框 blur 掉）。收起展开态，chip 收起来，
    // 恢复成"占位符/已选值摘要"的平时展示。
    _collapse(field){
      App.filter.FIELDS.forEach(f=>{
        App.filter._els(f).field.classList.remove('expanded', 'shrunk');
      });
      App.state.activeField = null;
      App.state.editQuery = '';
      App.dom.filterPopover.classList.remove('show');
      App.dom.filterPopoverOverlay.classList.remove('show');
      App.filter._syncCollapsedDisplay(field);
    },

    onInput(field, text){
      App.state.editQuery = text;
      App.filter._renderSuggestions(field);
    },

    addChip(field, value){
      const arr = App.state.sceneFilter[field];
      if(!arr.includes(value)) arr.push(value);
      App.state.editQuery = '';
      App.filter._els(field).input.value = '';
      App.filter._renderChips(field);
      App.filter._renderSuggestions(field);
      App.filter._position(); // chip 变多可能让输入框换行变高，卡片位置要跟着重算
      App.render._renderListResults();
    },

    removeChip(field, value){
      const arr = App.state.sceneFilter[field];
      const idx = arr.indexOf(value);
      if(idx !== -1) arr.splice(idx, 1);
      App.filter._renderChips(field);
      App.filter._renderSuggestions(field);
      App.filter._position();
      App.render._renderListResults();
    },

    // 建议卡片贴着当前展开的那个字段出现在下方，宽度跟那个字段展开后的宽度一样
    // （不再是整行那么宽），位置也直接锚定在那个字段身上，不管展开的是哪个字段，
    // 卡片相对它的位置关系都一样；只有贴着最右边的 Tag 展开时才可能超出屏幕，
    // 这种情况改成卡片右边缘对齐字段右边缘、往左边展开
    _position(){
      const appRect = App.dom.app.getBoundingClientRect();
      const fieldRect = App.filter._els(App.state.activeField).field.getBoundingClientRect();
      const pop = App.dom.filterPopover;
      const width = fieldRect.width;
      let left = fieldRect.left - appRect.left;
      const maxLeft = appRect.width - width - 8;
      if(left > maxLeft) left = Math.max(8, maxLeft);
      pop.style.width = width + 'px';
      pop.style.left = left + 'px';
      pop.style.top = (fieldRect.bottom - appRect.top + 6) + 'px';
    },

    _renderChips(field){
      const esc = App.utils.escapeHtml;
      const els = App.filter._els(field);
      const selected = App.state.sceneFilter[field];
      els.chips.innerHTML = selected.map(v=>
        `<span class="filter-chip" data-value="${esc(v)}">
          <span class="chip-label">${esc(v)}</span>
          <span class="chip-remove">${App.utils.icons.close}</span>
        </span>`
      ).join('');
      els.chips.querySelectorAll('.filter-chip').forEach(el=>{
        el.querySelector('.chip-remove').onclick = ()=>App.filter.removeChip(field, el.dataset.value);
      });
      // 已经有 chip 顶着了，输入框占位符就不用再重复显示字段名
      els.input.placeholder = selected.length ? '' : App.filter.LABELS[field];
    },

    // 没聚焦时的展示态：清空输入内容，占位符换成"字段名或已选值摘要"，chip 收起来不显示
    _syncCollapsedDisplay(field){
      const els = App.filter._els(field);
      els.input.value = '';
      els.input.placeholder = App.filter.pillLabel(field);
      els.chips.innerHTML = '';
    },

    // 建议列表：已选中的值不再出现在候选里（已经是 chip 了），
    // 打的字按子串、不分大小写去匹配现有值；没打字就把还没选的值全列出来，
    // 这样一聚焦马上能看到有哪些值可选，不用先打字才有反应
    _renderSuggestions(field){
      const esc = App.utils.escapeHtml;
      const selected = App.state.sceneFilter[field];
      const all = App.filter.getValues(field);
      const q = App.state.editQuery.trim().toLowerCase();
      const candidates = all.filter(v=>!selected.includes(v) && (!q || v.toLowerCase().includes(q)));
      const pop = App.dom.filterPopover;

      if(all.length === 0){
        pop.innerHTML = `<div class="fo-empty">还没有词标过 ${esc(App.filter.LABELS[field])}</div>`;
        return;
      }
      if(candidates.length === 0){
        pop.innerHTML = `<div class="fo-empty">没有匹配的值</div>`;
        return;
      }
      pop.innerHTML = candidates.map(v=>
        `<div class="filter-option" data-value="${esc(v)}">${esc(v)}</div>`
      ).join('');
      pop.querySelectorAll('.filter-option').forEach(el=>{
        el.onclick = ()=>App.filter.addChip(field, el.dataset.value);
      });
    }
  },

  // 复习：间隔重复调度（Leitner 盒子算法，具体的天数配置在 App.config.SR_INTERVALS）。
  // 这个模块只管"该复习哪些词、答对答后怎么调整进度"，卡片长什么样是 App.render.review() 的事。
  review: {
    isDue(w){ return (w.nextReview || 0) <= Date.now(); },

    buildQueue(dueOnly){
      const pool = dueOnly ? App.state.words.filter(App.review.isDue) : App.state.words.slice();
      pool.sort((a,b)=>(a.nextReview||0) - (b.nextReview||0));
      // 简单洗牌，避免每次都按同一个顺序背
      for(let i = pool.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool;
    },

    // 进入复习页 / 切换模式 / 完成一轮后点"再来一轮" 都调这个，重新建队列
    start(dueOnly){
      const S = App.state;
      S.reviewDueOnly = dueOnly;
      localStorage.setItem(App.config.REVIEW_MODE_KEY, dueOnly ? '1' : '0');
      S.reviewQueue = App.review.buildQueue(dueOnly);
      S.reviewIndex = 0;
      S.reviewFlipped = false;
      App.render.review();
    },

    setMode(dueOnly){
      if(dueOnly === App.state.reviewDueOnly) return;
      App.review.start(dueOnly);
    },

    grade(correct){
      const S = App.state;
      const w = S.reviewQueue[S.reviewIndex];
      const cfg = App.config;
      w.box = correct ? Math.min((w.box || 0) + 1, cfg.SR_MAX_BOX) : 0;
      w.nextReview = Date.now() + cfg.SR_INTERVALS[w.box] * cfg.SR_DAY;
      App.storage.save();

      S.reviewIndex++;
      S.reviewFlipped = false;
      App.render.review();
    }
  },

  // 备份：JSON 导出/导入。选 JSON 不选 CSV，是因为字段能 100% 保真
  // （box/nextReview 这些间隔重复字段也能完整带上），不用处理列名映射。
  backup: {
    pendingImport: null, // { list, newCount, dupCount, skipCount }

    open(){
      App.backup.renderMenu();
      App.dom.backupOverlay.classList.add('show');
      App.dom.backupSheet.classList.add('show');
    },
    close(){
      App.dom.backupOverlay.classList.remove('show');
      App.dom.backupSheet.classList.remove('show');
      App.backup.pendingImport = null;
      App.dom.importFileInput.value = ''; // 允许重复选同一个文件
    },

    renderMenu(){
      const g = App.gist;
      const ic = App.utils.icons;
      const gistDesc = g.isConfigured()
        ? (g.status || '已配置，改动会自动同步')
        : '还没配置，点这里设置';
      App.dom.backupBody.innerHTML = `
        <div class="backup-row" id="exportRow">
          <span class="bk-icon">${ic.download}</span>
          <div class="bk-text">
            <div class="bk-title">导出备份</div>
            <div class="bk-desc">把当前所有单词存成一个 JSON 文件</div>
          </div>
        </div>
        <div class="backup-row" id="importRow">
          <span class="bk-icon">${ic.upload}</span>
          <div class="bk-text">
            <div class="bk-title">导入备份</div>
            <div class="bk-desc">从之前导出的 JSON 文件恢复</div>
          </div>
        </div>
        <div class="backup-row" id="gistRow">
          <span class="bk-icon">${ic.cloud}</span>
          <div class="bk-text">
            <div class="bk-title">云同步</div>
            <div class="bk-desc" id="gistMenuDesc">${gistDesc}</div>
          </div>
        </div>`;
      document.getElementById('exportRow').onclick = App.backup.exportJson;
      document.getElementById('importRow').onclick = ()=>App.dom.importFileInput.click();
      document.getElementById('gistRow').onclick = ()=>App.gist.openSettings();
    },

    exportJson(){
      const data = JSON.stringify(App.state.words, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'grain-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      App.utils.toast('已导出');
      App.backup.close();
    },

    handleFile(e){
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        let raw;
        try{
          raw = JSON.parse(ev.target.result);
        }catch(err){
          App.utils.toast('文件不是合法的 JSON');
          return;
        }
        if(!Array.isArray(raw)){
          App.utils.toast('文件格式不对，应该是一个单词数组');
          return;
        }

        const existingSet = new Set(App.state.words.map(w => (w.word||'').toLowerCase() + '|' + (w.meaning||'').trim()));
        let newCount = 0, dupCount = 0, skipCount = 0;
        const list = [];
        raw.forEach(item=>{
          if(!item || !item.word || !item.meaning){ skipCount++; return; }
          const key = String(item.word).toLowerCase() + '|' + String(item.meaning).trim();
          const isDup = existingSet.has(key);
          if(isDup) dupCount++; else newCount++;
          list.push({
            id: item.id || App.utils.uid(),
            word: item.word, meaning: item.meaning,
            example: item.example || '', exampleZh: item.exampleZh || '',
            phonetic: item.phonetic || '', pos: item.pos || '',
            tag: item.tag || '', scene: item.scene || '', domain: item.domain || '',
            related: item.related || '',
            status: item.status || 1,
            date: item.date || new Date().toISOString().slice(0,10),
            box: typeof item.box === 'number' ? item.box : 0,
            nextReview: item.nextReview || Date.now(),
            createdAt: item.createdAt || Date.now(),
            _isDup: isDup
          });
        });

        App.backup.pendingImport = { list, newCount, dupCount, skipCount };
        App.backup.renderConfirm();
      };
      reader.readAsText(file, 'UTF-8');
    },

    renderConfirm(){
      const p = App.backup.pendingImport;
      App.dom.backupBody.innerHTML = `
        <button class="sheet-back" id="backupBackBtn">${App.utils.icons.chevronLeft}<span>返回</span></button>
        <div class="sheet-title">确认导入</div>
        <div class="backup-stats">
          <div><strong>${p.newCount}</strong> 条新单词</div>
          <div><strong>${p.dupCount}</strong> 条与现有重复</div>
          ${p.skipCount ? `<div><strong>${p.skipCount}</strong> 条跳过（缺单词或释义）</div>` : ''}
        </div>
        <div class="sheet-actions" style="flex-direction:column;">
          <button class="btn btn-primary" id="mergeBtn">合并导入（跳过重复）</button>
          <button class="btn" id="overwriteBtn" style="background:var(--danger-soft);color:var(--danger);">覆盖导入（替换全部现有数据）</button>
        </div>`;
      document.getElementById('mergeBtn').onclick = ()=>App.backup.applyImport('merge');
      document.getElementById('overwriteBtn').onclick = ()=>App.backup.applyImport('overwrite');
      document.getElementById('backupBackBtn').onclick = ()=>{
        App.backup.pendingImport = null;
        App.dom.importFileInput.value = '';
        App.backup.renderMenu();
      };
    },

    applyImport(mode){
      const p = App.backup.pendingImport;
      if(!p) return;
      if(mode === 'overwrite'){
        App.state.words = p.list.map(w=>{ const c={...w}; delete c._isDup; return c; });
      } else {
        const toAdd = p.list.filter(w=>!w._isDup).map(w=>{ const c={...w}; delete c._isDup; return c; });
        App.state.words = App.state.words.concat(toAdd);
      }
      App.storage.save();
      App.utils.toast(mode === 'overwrite' ? '已覆盖导入' : `已合并导入 ${p.newCount} 条`);
      App.backup.close();
      App.render.main();
    }
  },

  // 云同步：GitHub Gist。跟 Words.html 用的是同一个 GitHub Token，
  // 但 Gist 是 Grain 专属的新建 Gist，跟 Words.html 各用各的文件，
  // 避免共用一个 Gist 时，对方一推送就让这边误判"云端冲突"。
  gist: {
    config: {
      FILENAME: 'grain-words.json',
      TOKEN_KEY: 'grain_gist_token',
      GIST_ID_KEY: 'grain_gist_id',
      KNOWN_VERSION_KEY: 'grain_gist_known_version',
      PUSH_DEBOUNCE_MS: 8000,   // 改动之后等这么久没有新改动，才真正推送，避免连续编辑时狂发请求
      PUSH_MIN_INTERVAL_MS: 10000
    },
    status: '',
    _busy: false,
    _lastPush: 0,
    _pushTimer: null,

    isConfigured(){
      return !!(localStorage.getItem(App.gist.config.TOKEN_KEY) && localStorage.getItem(App.gist.config.GIST_ID_KEY));
    },

    setStatus(msg, type){
      App.gist.status = msg;
      App.gist.statusType = type || 'neutral';
      const el = document.getElementById('gistStatus');
      if(el){
        el.textContent = msg;
        el.className = 'gist-status-' + App.gist.statusType;
      }
    },

    openSettings(){
      const cfg = App.gist.config;
      const token = localStorage.getItem(cfg.TOKEN_KEY) || '';
      const gistId = localStorage.getItem(cfg.GIST_ID_KEY) || '';
      App.dom.backupBody.innerHTML = `
        <button class="sheet-back" id="gistBackBtn">${App.utils.icons.chevronLeft}<span>返回</span></button>
        <div class="sheet-title">云同步</div>
        <div class="field"><label>GitHub Token</label><input id="gistTokenInput" type="password" value="${App.utils.escapeHtml(token)}" placeholder="ghp_xxxxxxxx" autocomplete="off"></div>
        <div class="field"><label>Gist ID <span style="font-weight:400;color:var(--ink-faint);">（留空会自动新建一个）</span></label><input id="gistIdInput" value="${App.utils.escapeHtml(gistId)}" placeholder="留空 = 自动创建新 Gist" autocomplete="off"></div>
        <div style="font-size:var(--fs-sm);color:var(--ink-faint);margin:-6px 0 14px;">状态：<span id="gistStatus" class="gist-status-${App.gist.statusType || 'neutral'}">${App.utils.escapeHtml(App.gist.status || (App.gist.isConfigured() ? '已配置' : '未配置'))}</span></div>
        <div class="sheet-actions" style="flex-direction:column;">
          <button class="btn btn-primary" id="gistSaveBtn">保存配置</button>
          <div class="sheet-actions" style="margin-top:0;">
            <button class="btn" id="gistPushBtn" style="background:var(--surface-2);color:var(--ink);">立即上传</button>
            <button class="btn" id="gistPullBtn" style="background:var(--surface-2);color:var(--ink);">立即下载</button>
          </div>
        </div>`;
      document.getElementById('gistSaveBtn').onclick = App.gist.saveConfig;
      document.getElementById('gistPushBtn').onclick = ()=>App.gist.push(true);
      document.getElementById('gistPullBtn').onclick = ()=>App.gist.pull(true);
      document.getElementById('gistBackBtn').onclick = ()=>App.backup.renderMenu();
    },

    saveConfig(){
      const cfg = App.gist.config;
      const token = document.getElementById('gistTokenInput').value.trim();
      const gistId = document.getElementById('gistIdInput').value.trim();
      if(!token){
        App.utils.toast('先填 Token');
        return;
      }
      localStorage.setItem(cfg.TOKEN_KEY, token);
      if(gistId){
        localStorage.setItem(cfg.GIST_ID_KEY, gistId);
        App.utils.toast('已保存');
        App.gist.setStatus('已配置', 'ok');
      } else {
        // Gist ID 留空：自动创建一个新的私有 Gist，创建好把 ID 自动填回去
        App.gist.createGist(token);
      }
    },

    async createGist(token){
      const cfg = App.gist.config;
      App.gist.setStatus('正在创建 Gist…', 'neutral');
      try{
        const res = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            description: 'Grain 单词本数据',
            public: false,
            files: { [cfg.FILENAME]: { content: App.gist.buildContent() } }
          })
        });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        localStorage.setItem(cfg.GIST_ID_KEY, data.id);
        if(data.updated_at) localStorage.setItem(cfg.KNOWN_VERSION_KEY, data.updated_at);
        const idInput = document.getElementById('gistIdInput');
        if(idInput) idInput.value = data.id;
        App.gist.setStatus('Gist 创建成功，ID 已自动填入 ✓', 'ok');
        App.utils.toast('已创建并保存');
      }catch(e){
        App.gist.setStatus('创建失败：' + e.message, 'error');
      }
    },

    buildContent(){
      return JSON.stringify(App.state.words, null, 2);
    },

    // 改动数据后调用：防抖等待，安静地（非手动）推一次
    scheduleAutoPush(){
      if(!App.gist.isConfigured()) return;
      clearTimeout(App.gist._pushTimer);
      App.gist._pushTimer = setTimeout(()=>App.gist.push(false), App.gist.config.PUSH_DEBOUNCE_MS);
    },

    async push(manual){
      const cfg = App.gist.config;
      const token = localStorage.getItem(cfg.TOKEN_KEY);
      const gistId = localStorage.getItem(cfg.GIST_ID_KEY);
      if(!token || !gistId){ if(manual) App.utils.toast('先配置 Token 和 Gist ID'); return; }
      if(App.gist._busy){ if(manual) App.utils.toast('同步进行中，稍等'); return; }
      if(!manual && (Date.now() - App.gist._lastPush) < cfg.PUSH_MIN_INTERVAL_MS) return;

      App.gist._busy = true;
      if(manual) App.gist.setStatus('检查云端状态…', 'neutral');
      try{
        // 推送前先确认云端没被别的设备改过，避免静默覆盖对方的修改
        const checkRes = await fetch('https://api.github.com/gists/' + gistId, {
          headers: { Authorization: 'token ' + token }
        });
        if(!checkRes.ok) throw new Error('HTTP ' + checkRes.status);
        const remote = await checkRes.json();
        const known = localStorage.getItem(cfg.KNOWN_VERSION_KEY);
        if(known && remote.updated_at && known !== remote.updated_at){
          App.gist._busy = false;
          if(manual) App.gist.setStatus('检测到云端有更新，请先处理冲突', 'error');
          App.gist.showConflictBanner();
          return;
        }
        await App.gist._doPush(token, gistId, manual);
      }catch(e){
        if(manual) App.gist.setStatus('检查失败：' + e.message, 'error');
      }finally{
        App.gist._busy = false;
      }
    },

    async _doPush(token, gistId, manual){
      const cfg = App.gist.config;
      try{
        const res = await fetch('https://api.github.com/gists/' + gistId, {
          method: 'PATCH',
          headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: { [cfg.FILENAME]: { content: App.gist.buildContent() } } })
        });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        App.gist._lastPush = Date.now();
        if(data.updated_at) localStorage.setItem(cfg.KNOWN_VERSION_KEY, data.updated_at);
        if(manual) App.gist.setStatus('上传成功 ✓ ' + new Date().toLocaleTimeString(), 'ok');
      }catch(e){
        if(manual) App.gist.setStatus('上传失败：' + e.message, 'error');
      }
    },

    async pull(manual){
      const cfg = App.gist.config;
      const token = localStorage.getItem(cfg.TOKEN_KEY);
      const gistId = localStorage.getItem(cfg.GIST_ID_KEY);
      if(!token || !gistId){ if(manual) App.utils.toast('先配置 Token 和 Gist ID'); return; }
      if(manual) App.gist.setStatus('下载中…', 'neutral');
      try{
        const res = await fetch('https://api.github.com/gists/' + gistId, {
          headers: { Authorization: 'token ' + token }
        });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const file = data.files && data.files[cfg.FILENAME];
        if(!file){
          if(manual) App.gist.setStatus('Gist 里还没有 Grain 的数据文件，先上传一次', 'neutral');
          return;
        }
        const content = JSON.parse(file.content);
        if(Array.isArray(content)){
          App.state.words = content;
          App.storage.save({ skipAutoPush: true }); // 拉下来的数据不用再推回去
        }
        if(data.updated_at) localStorage.setItem(cfg.KNOWN_VERSION_KEY, data.updated_at);
        if(manual) App.gist.setStatus('下载成功 ✓ ' + new Date().toLocaleTimeString(), 'ok');
        App.render.main();
      }catch(e){
        if(manual) App.gist.setStatus('下载失败：' + e.message, 'error');
      }
    },

    // 冲突提示条：跟"添加/备份"那两个 sheet 是独立的浮层，不管当前在哪个页面都能弹出来
    showConflictBanner(){
      if(document.getElementById('gistConflictBanner')) return;
      const banner = document.createElement('div');
      banner.id = 'gistConflictBanner';
      banner.className = 'conflict-banner';
      banner.innerHTML = `
        <div style="margin-bottom:10px;">⚠️ 检测到云端有更新（可能来自其他设备），是否用本地数据覆盖云端？</div>
        <div style="display:flex;gap:8px;">
          <button id="cfOverwrite" style="flex:1;padding:8px 4px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:var(--fs-sm);cursor:pointer;">覆盖云端</button>
          <button id="cfPull" style="flex:1;padding:8px 4px;background:var(--surface-2);color:var(--ink);border:none;border-radius:6px;font-size:var(--fs-sm);cursor:pointer;">改用云端数据</button>
          <button id="cfDismiss" style="flex:1;padding:8px 4px;background:var(--surface-2);color:var(--ink-soft);border:none;border-radius:6px;font-size:var(--fs-sm);cursor:pointer;">稍后再说</button>
        </div>`;
      document.body.appendChild(banner);
      document.getElementById('cfOverwrite').onclick = ()=>App.gist.resolveConflict('overwrite');
      document.getElementById('cfPull').onclick = ()=>App.gist.resolveConflict('pull');
      document.getElementById('cfDismiss').onclick = ()=>App.gist.resolveConflict('dismiss');
    },

    resolveConflict(action){
      const banner = document.getElementById('gistConflictBanner');
      if(banner) banner.remove();
      if(action === 'overwrite'){
        const cfg = App.gist.config;
        App.gist._busy = true;
        App.gist._doPush(localStorage.getItem(cfg.TOKEN_KEY), localStorage.getItem(cfg.GIST_ID_KEY), true)
          .finally(()=>{ App.gist._busy = false; });
      } else if(action === 'pull'){
        App.gist.pull(true);
      }
      // dismiss：本地改动先留着，下次自动推送时会重新检测
    }
  },

  // 添加/编辑单词共用的底部弹出表单。新增和编辑是同一套 HTML、同一个 save()，
  // 靠 state.editingId 有没有值来区分（有值=编辑已有单词，null=新建）。
  sheet: {
    // Part of Speech 历史值：词性来来回回就那几种，不用每次手打——从已有单词里
    // 收集出现过的值塞进 <datalist>，靠浏览器原生的输入建议来选，不用额外做弹层。
    // 打开表单（新增/编辑）时刷新一次就够了，没必要实时监听数据变化。
    _refreshPosOptions(){
      const esc = App.utils.escapeHtml;
      const set = new Set();
      App.state.words.forEach(w=>{
        const v = (w.pos || '').trim();
        if(v) set.add(v);
      });
      const values = Array.from(set).sort((a,b)=>a.localeCompare(b, 'zh'));
      App.dom.posOptions.innerHTML = values.map(v=>`<option value="${esc(v)}"></option>`).join('');
    },

    openAdd(){
      const S = App.state;
      S.editingId = null;
      App.dom.sheetTitle.textContent = 'Add Word';
      App.dom.deleteBtn.style.display = 'none';
      ['fWord','fMeaning','fExample','fPhonetic','fPos','fExampleZh','fTag','fScene','fDomain','fRelated']
        .forEach(id=>document.getElementById(id).value = '');
      document.getElementById('fStatus').value = '1';
      document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
      App.dom.moreFields.classList.remove('open');
      App.dom.moreToggle.classList.remove('open');
      App.sheet._refreshPosOptions();
      App.sheet.show();
      setTimeout(()=>document.getElementById('fWord').focus(), 300);
    },

    openEdit(id){
      const S = App.state;
      const w = S.words.find(x=>x.id === id);
      if(!w) return;
      S.editingId = id;
      App.dom.sheetTitle.textContent = 'Edit Word';
      App.dom.deleteBtn.style.display = 'block';

      document.getElementById('fWord').value = w.word || '';
      document.getElementById('fMeaning').value = w.meaning || '';
      document.getElementById('fExample').value = w.example || '';
      document.getElementById('fPhonetic').value = w.phonetic || '';
      document.getElementById('fPos').value = w.pos || '';
      document.getElementById('fExampleZh').value = w.exampleZh || '';
      document.getElementById('fTag').value = w.tag || '';
      document.getElementById('fScene').value = w.scene || '';
      document.getElementById('fDomain').value = w.domain || '';
      document.getElementById('fRelated').value = w.related || '';
      document.getElementById('fStatus').value = String(w.status || 1);
      document.getElementById('fDate').value = w.date || new Date().toISOString().slice(0,10);

      // More 区域统一保持收起——不管字段里有没有数据都一样，跟"新增"那边的行为对齐，
      // 用户自己点开看，不用 AI 猜"有数据就该默认展开"
      App.dom.moreFields.classList.remove('open');
      App.dom.moreToggle.classList.remove('open');

      App.sheet._refreshPosOptions();
      App.sheet.show();
    },

    show(){
      App.dom.sheetOverlay.classList.add('show');
      App.dom.sheet.classList.add('show');
    },
    close(){
      App.dom.sheetOverlay.classList.remove('show');
      App.dom.sheet.classList.remove('show');
    },

    save(){
      const S = App.state;
      const word = document.getElementById('fWord').value.trim();
      const meaning = document.getElementById('fMeaning').value.trim();
      if(!word || !meaning){
        App.utils.toast('单词和释义都要填哦');
        return;
      }

      const existing = S.editingId ? S.words.find(x=>x.id === S.editingId) : null;

      const data = {
        id: S.editingId || App.utils.uid(),
        word, meaning,
        example: document.getElementById('fExample').value.trim(),
        phonetic: document.getElementById('fPhonetic').value.trim(),
        pos: document.getElementById('fPos').value.trim(),
        exampleZh: document.getElementById('fExampleZh').value.trim(),
        tag: document.getElementById('fTag').value.trim(),
        scene: document.getElementById('fScene').value.trim(),
        domain: document.getElementById('fDomain').value.trim(),
        related: document.getElementById('fRelated').value.trim(),
        status: parseInt(document.getElementById('fStatus').value, 10),
        date: document.getElementById('fDate').value,
        // 间隔重复调度字段：编辑时保留原有进度，新词从今天开始
        box: existing ? existing.box : 0,
        nextReview: existing ? existing.nextReview : Date.now(),
        createdAt: existing ? existing.createdAt : Date.now()
      };

      if(existing){
        Object.assign(existing, data);
        App.utils.toast('已保存');
      } else {
        S.words.push(data);
        App.utils.toast('已添加');
      }
      App.storage.save();
      App.sheet.close();
      App.render.main();
    },

    delete(){
      const S = App.state;
      if(!S.editingId) return;
      if(!confirm('确定删除这个单词吗？')) return;
      S.words = S.words.filter(w=>w.id !== S.editingId);
      App.storage.save();
      App.sheet.close();
      App.render.main();
    }
  },

  init(){
    this.dom = {
      app: document.getElementById('app'),
      main: document.getElementById('main'),
      headerSearch: document.getElementById('headerSearch'),
      searchInput: document.getElementById('listSearchInput'),
      filterToggleBtn: document.getElementById('filterToggleBtn'),
      filterRow: document.getElementById('filterRow'),
      filterFieldScene: document.getElementById('filterFieldScene'),
      filterChipsScene: document.getElementById('filterChipsScene'),
      filterInputScene: document.getElementById('filterInputScene'),
      filterFieldDomain: document.getElementById('filterFieldDomain'),
      filterChipsDomain: document.getElementById('filterChipsDomain'),
      filterInputDomain: document.getElementById('filterInputDomain'),
      filterFieldTag: document.getElementById('filterFieldTag'),
      filterChipsTag: document.getElementById('filterChipsTag'),
      filterInputTag: document.getElementById('filterInputTag'),
      filterResetBtn: document.getElementById('filterResetBtn'),
      filterPopover: document.getElementById('filterPopover'),
      filterPopoverOverlay: document.getElementById('filterPopoverOverlay'),
      toast: document.getElementById('toast'),
      sheet: document.getElementById('sheet'),
      sheetOverlay: document.getElementById('sheetOverlay'),
      sheetTitle: document.getElementById('sheetTitle'),
      moreToggle: document.getElementById('moreToggle'),
      moreFields: document.getElementById('moreFields'),
      posOptions: document.getElementById('posOptions'),
      deleteBtn: document.getElementById('deleteBtn'),
      saveBtn: document.getElementById('saveBtn'),
      fabAdd: document.getElementById('fabAdd'),
      settingsBtn: document.getElementById('settingsBtn'),
      backupSheet: document.getElementById('backupSheet'),
      backupOverlay: document.getElementById('backupOverlay'),
      backupBody: document.getElementById('backupBody'),
      importFileInput: document.getElementById('importFileInput')
    };

    this.dom.fabAdd.onclick = ()=>this.sheet.openAdd();
    this.dom.sheetOverlay.onclick = ()=>this.sheet.close();
    this.dom.saveBtn.onclick = ()=>this.sheet.save();
    this.dom.deleteBtn.onclick = ()=>this.sheet.delete();
    this.dom.moreToggle.onclick = ()=>{
      this.dom.moreFields.classList.toggle('open');
      this.dom.moreToggle.classList.toggle('open');
    };

    // 搜索框是 header 里的常驻元素，绑定一次就行，不会因为切 tab 或重新渲染列表而丢失
    this.dom.searchInput.oninput = (e)=>{
      this.state.searchQuery = e.target.value;
      this.render._renderListResults();
    };

    this.dom.settingsBtn.onclick = ()=>this.backup.open();
    this.dom.backupOverlay.onclick = ()=>this.backup.close();
    this.dom.importFileInput.onchange = (e)=>this.backup.handleFile(e);

    // 三个筛选输入框本身就是真正的 input：原生 focus/blur 驱动展开/收起，
    // 点一下直接聚焦弹键盘，不用先点别的东西再手动 focus。
    // 建议卡片上挡了 mousedown 默认行为，所以点建议项不会在 click 触发前先把输入框 blur 掉。
    // 输入框为空时按退格键相当于删掉最后一个 chip（tag 输入的常见手势）。
    this.filter.FIELDS.forEach(field=>{
      const els = this.filter._els(field);
      els.input.addEventListener('focus', ()=>this.filter._expand(field));
      els.input.addEventListener('blur', ()=>this.filter._collapse(field));
      els.input.addEventListener('input', (e)=>this.filter.onInput(field, e.target.value));
      els.input.addEventListener('keydown', (e)=>{
        if(e.key === 'Backspace' && !e.target.value){
          const arr = this.state.sceneFilter[field];
          if(arr.length) this.filter.removeChip(field, arr[arr.length - 1]);
        }
      });
    });
    this.dom.filterResetBtn.onclick = ()=>this.filter.reset();
    this.dom.filterPopoverOverlay.onclick = ()=>this.filter.collapseActive();
    this.dom.filterPopover.addEventListener('mousedown', e=>e.preventDefault());
    // header 上的三横线图标：开关筛选行的显示/隐藏；收起的时候顺带把还开着的输入框收一下，
    // 别让筛选行都要消失了还留一个展开态的建议卡片飘在那
    this.dom.filterToggleBtn.onclick = ()=>{
      this.state.filterRowExpanded = !this.state.filterRowExpanded;
      if(!this.state.filterRowExpanded) this.filter.collapseActive();
      this.render.syncFilterRow();
    };

    document.querySelectorAll('.nav-btn').forEach(btn=>{
      btn.onclick = ()=>{
        this.state.currentTab = btn.dataset.tab;
        this.render.syncNav();
        this.render.syncHeaderSearch();
        this.filter.collapseActive(); // 切走词库页时，展开态要是还开着就一起收起来，别浮在别的页面上方
        this.render.syncFilterRow();
        if(btn.dataset.tab === 'review'){
          this.review.start(this.state.reviewDueOnly);
        } else {
          this.render.main();
        }
      };
    });

    // 恢复上次选的"今日复习/全部单词"偏好
    this.state.reviewDueOnly = localStorage.getItem(this.config.REVIEW_MODE_KEY) !== '0';

    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
      });
    }

    this.storage.load();
    this.render.main();

    // 启动时如果配置了云同步，静默拉一次最新数据
    if(this.gist.isConfigured()) this.gist.pull(false);
  }
};

App.init();
window.App = App; // 方便控制台调试
</script>
</body>
</html>
