<style>
  :root{
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --surface-2: #ECEEF2;
    --border: #E2E4E9;
    --ink: #14161A;
    --ink-soft: #6B7280;
    --ink-faint: #9CA3AF;
    --accent: #4F46E5;
    --accent-soft: #EEF0FF;
    --accent-deep: #3730A3;
    --danger: #DC4C4C;
    --danger-soft: #FDECEC;
    --success: #16A34A;
    --success-soft: #E8F7EE;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 3px rgba(20,22,26,0.06), 0 1px 2px rgba(20,22,26,0.04);
    --shadow-lg: 0 12px 28px rgba(20,22,26,0.14);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  #app{

    flex-direction:column;

  }

  .icon-btn{
    width:30px; height:30px;

  .backup-row{

  .backup-row:last-child{ border-bottom:none; }
  .backup-row .bk-icon{

    border-radius:11px;

    color:var(--accent);

  }
  .backup-row .bk-icon svg{ width:19px; height:19px; }
  .backup-row .bk-text .bk-title{ font-size:15px; font-weight:700; }
  .backup-row .bk-text .bk-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .backup-stats{
    background:var(--surface-2);

  .conflict-banner{
    position:fixed;
    left:50%; bottom:24px;

  main{
    flex:1;
    padding:4px 16px 100px;

  /* ── 单词列表 ── */
  .word-card{
    background:var(--surface);

  .word-card .row1{

  .word-card .word{

  .word-card .pos{

  .status-badge{

  .word-card .meaning{

  .word-card .example{

  .empty-state{

  /* ── FAB ── */
  .fab{

  .field{ margin-bottom:14px; }

  .field textarea{ min-height:64px; resize:vertical; line-height:1.5; }
  .field-row{ display:flex; gap:10px; }

  .more-toggle{
    background:none; border:none; padding:6px 0 14px;

  .more-fields.open{ display:flex; }

  .sheet-actions{
    display:flex; gap:10px; margin-top:6px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:var(--radius-sm);
    padding:13px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;

  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:active{ background:var(--accent-deep); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); flex:none; padding:13px 18px; }

  /* ── 复习：模式切换 ── */
  .review-mode-toggle{
    display:flex; gap:8px;
    margin:6px 0 16px;
  }
  .mode-btn{
    flex:1;
    padding:9px 10px;
    border-radius:20px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .mode-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .review-progress{
    font-size:12.5px;
    color:var(--ink-faint);
    margin-bottom:10px;
  }

  /* ── 复习卡片 ── */
  @keyframes cardFlipIn{
    from{ transform:scaleX(0.9) rotateY(8deg); opacity:0.3; }
    to{ transform:scaleX(1) rotateY(0deg); opacity:1; }
  }
  .review-card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    min-height:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 22px;
    text-align:center;
    cursor:pointer;
    animation:cardFlipIn .28s cubic-bezier(.2,.8,.2,1);
    transform-origin:center;
  }
  .review-card:active{ transform:scale(0.98); }
  .review-card .rc-word{
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .review-card .rc-phonetic{
    font-size:14px;
    color:var(--ink-faint);
    margin-top:6px;
  }
  .review-card .rc-hint{
    margin-top:20px;
    font-size:13px;
    color:var(--ink-faint);
  }
  .review-card.flipped{
    align-items:stretch;
    text-align:left;
    cursor:default;
    padding:22px;
  }
  .review-card .rc-back-word{
    font-size:22px;
    font-weight:800;
  }
  .review-card .rc-meaning{
    color:var(--accent);
    font-size:15px;
    font-weight:600;
    margin-top:6px;
  }
  .review-card .rc-example{
    border-top:1px solid var(--border);
    margin-top:14px;
    padding-top:12px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
  }

  .review-actions{ display:flex; gap:10px; margin-top:16px; }
  .review-actions button{
    flex:1; border:none; border-radius:var(--radius-sm);
    padding:14px 10px; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .btn-forgot{ background:var(--danger-soft); color:var(--danger); }
  .btn-known{ background:var(--accent); color:#fff; }

  .toast{
    position:fixed;
    bottom:30px; left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:30;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Grain</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="count" id="headerCount"></span>
      <button class="icon-btn" id="settingsBtn" aria-label="备份设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>
  <main id="main"></main>

  <nav class="nav-bar">
    <button class="nav-btn" data-tab="list"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg></span><span>词库</span></button>
    <button class="nav-btn" data-tab="review"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span><span>复习</span></button>
  </nav>

  <button class="fab" id="fabAdd">+</button>

  <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">

  <div class="sheet-overlay" id="backupOverlay"></div>
  <div class="sheet" id="backupSheet">
    <div class="sheet-handle"></div>
    <div id="backupBody"></div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">添加单词</div>

    <div class="field"><label>单词 *</label><input id="fWord" autocomplete="off" autocapitalize="off" placeholder="例如 abandon"></div>
    <div class="field"><label>释义 *</label><input id="fMeaning" autocomplete="off" placeholder="例如 放弃，抛弃"></div>

    <button type="button" class="more-toggle" id="moreToggle">
      <span class="arrow">▸</span><span>更多（音标 / 词性 / 标签…）</span>
    </button>
    <div class="more-fields" id="moreFields">
      <div class="field-row">
        <div class="field"><label>音标</label><input id="fPhonetic" autocomplete="off" placeholder="/əˈbændən/"></div>
        <div class="field"><label>词性</label><input id="fPos" autocomplete="off" placeholder="v."></div>
      </div>
      <div class="field"><label>例句释义</label><textarea id="fExampleZh" placeholder="他抛弃了那辆车。"></textarea></div>
      <div class="field"><label>标签</label><input id="fTag" autocomplete="off"></div>

      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/*
 * 命名空间约定：所有状态/逻辑/渲染都挂在 App 下面，不在顶层再声明裸变量/函数。
 *   App.config   —— 常量配置
 *   App.state    —— 运行时状态
 *   App.storage  —— 读写 localStorage
 *   App.render   —— 渲染函数
 *   App.utils    —— 工具函数
 * 调试时控制台可以直接用 App.state.words 查看数据。
 */
const App = {

  config: {
    STORAGE_KEY: 'words-v2-data',
    REVIEW_MODE_KEY: 'words-v2-review-mode',
    // 间隔重复：盒子编号对应的复习间隔天数，答对了盒子往上升、间隔拉长；答错了打回盒0
    SR_DAY: 24 * 60 * 60 * 1000,
    SR_INTERVALS: [0, 1, 2, 4, 7, 15],
    get SR_MAX_BOX(){ return this.SR_INTERVALS.length - 1; }
  },

  state: {
    words: [],
    editingId: null,
    currentTab: 'list', // 'list' 词库 | 'review' 复习
    reviewDueOnly: true,  // true=只看今日到期 false=全部单词
    reviewQueue: [],
    reviewIndex: 0,
    reviewFlipped: false
  },

  dom: {},

  storage: {
    load(){
      try{
        const raw = localStorage.getItem(App.config.STORAGE_KEY);
        App.state.words = raw ? JSON.parse(raw) : [];
      }catch(e){
        App.state.words = [];
        App.utils.toast('本地数据读取失败');
      }
      // 防御性迁移：万一以后从别处导入数据、缺 box/nextReview 字段，这里补上，
      // 不然复习功能会因为 undefined 报错
      let migrated = false;
      App.state.words.forEach(w=>{
        if(typeof w.box !== 'number' || !w.nextReview){
          w.box = 0;
          w.nextReview = Date.now();
          migrated = true;
        }
      });
      if(migrated) App.storage.save();
    },
    save(opts){
      try{
        localStorage.setItem(App.config.STORAGE_KEY, JSON.stringify(App.state.words));
        if(!(opts && opts.skipAutoPush)) App.gist.scheduleAutoPush();
      }catch(e){
        App.utils.toast('保存失败，存储空间可能已满');
      }
    }
  },

  utils: {
    uid(){ return 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); },
    escapeHtml(str){
      return String(str || '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    },
    toast(msg){
      const el = App.dom.toast;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(App.utils._toastTimer);
      App.utils._toastTimer = setTimeout(()=>el.classList.remove('show'), 1600);
    },
    // 用线条 SVG 换掉 emoji：emoji 不吃 currentColor，换设备/字体样子还不一样，
    // 跟我们特地调的靛蓝配色系统脱节。这些图标统一用 stroke="currentColor"，
    // 套在什么颜色的容器里就跟着变什么颜色。
    icons: {
      book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg>',
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',

  render: {
    main(){
      App.render.syncNav();
      const S = App.state;
      if(S.currentTab === 'review') App.render.review();
      else App.render.list();
    },

    syncNav(){
      const S = App.state;
      document.querySelectorAll('.nav-btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.tab === S.currentTab);
      });
    },

    list(){
      const S = App.state;
      App.dom.headerCount.textContent = S.words.length ? String(S.words.length) : '';
      const $main = App.dom.main;

      if(S.words.length === 0){
        $main.innerHTML = `<div class="empty-state">
          <div class="big">还没有单词</div>
          <div>点右下角 "+" 添加第一个吧</div>
        </div>`;
        return;
      }

      const esc = App.utils.escapeHtml;
      const list = S.words.slice().sort((a,b)=>b.createdAt - a.createdAt);
      $main.innerHTML = list.map(w=>{
        const tags = [w.pos, w.tag, w.scene, w.domain].filter(Boolean);
        const mastered = w.status === 2;
        return `<div class="word-card" data-id="${w.id}">
          <div class="row1">
            <span class="word">${esc(w.word)}</span>
            <span class="row1-right">
              ${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ''}
              <span class="status-badge ${mastered ? 'mastered' : 'learning'}">${mastered ? '已掌握' : '学习中'}</span>
            </span>
          </div>
          <div class="meaning">${esc(w.meaning)}</div>
          ${w.example ? `<div class="example">${esc(w.example)}${w.exampleZh ? '<br>' + esc(w.exampleZh) : ''}</div>` : ''}
          ${tags.length && (w.tag || w.scene || w.domain) ? `<div class="tags">${[w.tag,w.scene,w.domain].filter(Boolean).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}</div>` : ''}
        </div>`;
      }).join('');

      $main.querySelectorAll('.word-card').forEach(card=>{
        card.onclick = ()=>App.sheet.openEdit(card.dataset.id);
      });
    },

    // 复习页面：只负责把 state.reviewQueue/reviewIndex/reviewFlipped 画出来，
    // 不在这里重建队列——重建队列的活由 App.review.start() 做
    review(){
      const S = App.state;
      const $main = App.dom.main;
      App.dom.headerCount.textContent = '';
      const esc = App.utils.escapeHtml;

      const modeToggleHtml = `<div class="review-mode-toggle">
        <button class="mode-btn ${S.reviewDueOnly ? 'active':''}" id="modeDueBtn">今日复习</button>
        <button class="mode-btn ${!S.reviewDueOnly ? 'active':''}" id="modeAllBtn">全部单词</button>
      </div>`;

      if(S.words.length === 0){
        $main.innerHTML = modeToggleHtml + `<div class="empty-state">
          <div class="big">词库还是空的</div>
          <div>先去"词库"添加几个单词吧</div>
        </div>`;
        App.render._bindModeButtons();
        return;
      }

      if(S.reviewQueue.length === 0){
        if(S.reviewDueOnly){
          $main.innerHTML = modeToggleHtml + `<div class="empty-state">
            <div class="big">今天要复习的都完成啦</div>
            <div>可以点上面切到"全部单词"提前复习</div>
          </div>`;
        } else {
          $main.innerHTML = modeToggleHtml + `<div class="empty-state">
            <div class="big">暂无单词</div>
          </div>`;
        }
        App.render._bindModeButtons();
        return;
      }

      if(S.reviewIndex >= S.reviewQueue.length){
        $main.innerHTML = modeToggleHtml + `<div class="empty-state">
          <div class="big">本轮复习完成！</div>
          <div>共复习了 ${S.reviewQueue.length} 个单词</div>
        </div>
        <button class="btn btn-primary" id="reviewAgainBtn" style="margin-top:14px;">再来一轮</button>`;
        App.render._bindModeButtons();
        document.getElementById('reviewAgainBtn').onclick = ()=>App.review.start(S.reviewDueOnly);
        return;
      }

      const w = S.reviewQueue[S.reviewIndex];
      let cardHtml;
      if(!S.reviewFlipped){
        cardHtml = `<div class="review-card" id="reviewCard">
          <div class="rc-word">${esc(w.word)}</div>
          ${w.phonetic ? `<div class="rc-phonetic">${esc(w.phonetic)}</div>` : ''}
          <div class="rc-hint">点击卡片查看释义</div>
        </div>`;
      } else {
        cardHtml = `<div class="review-card flipped" id="reviewCard">
          <div class="rc-back-word">${esc(w.word)}${w.phonetic ? ` <span class="rc-phonetic">${esc(w.phonetic)}</span>` : ''}</div>
          <div class="rc-meaning">${esc(w.meaning)}</div>
          ${w.example ? `<div class="rc-example">${esc(w.example)}${w.exampleZh ? '<br>' + esc(w.exampleZh) : ''}</div>` : ''}
        </div>
        <div class="review-actions">
          <button class="btn-forgot" id="btnForgot">还没记住</button>
          <button class="btn-known" id="btnKnown">记住了</button>
        </div>`;
      }

      $main.innerHTML = modeToggleHtml +
        `<div class="review-progress">复习中 ${S.reviewIndex + 1} / ${S.reviewQueue.length}</div>` +
        cardHtml;

      App.render._bindModeButtons();
      if(!S.reviewFlipped){
        document.getElementById('reviewCard').onclick = ()=>{
          S.reviewFlipped = true;
          App.render.review();
        };
      } else {
        document.getElementById('btnForgot').onclick = ()=>App.review.grade(false);
        document.getElementById('btnKnown').onclick = ()=>App.review.grade(true);
      }
    },

    _bindModeButtons(){
      const dueBtn = document.getElementById('modeDueBtn');
      const allBtn = document.getElementById('modeAllBtn');
      if(dueBtn) dueBtn.onclick = ()=>App.review.setMode(true);
      if(allBtn) allBtn.onclick = ()=>App.review.setMode(false);
    }
  },

  review: {
    isDue(w){ return (w.nextReview || 0) <= Date.now(); },

    buildQueue(dueOnly){
      const pool = dueOnly ? App.state.words.filter(App.review.isDue) : App.state.words.slice();
      pool.sort((a,b)=>(a.nextReview||0) - (b.nextReview||0));
      // 简单洗牌，避免每次都按同一个顺序背
      for(let i = pool.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool;
    },

    // 进入复习页 / 切换模式 / 完成一轮后点"再来一轮" 都调这个，重新建队列
    start(dueOnly){
      const S = App.state;
      S.reviewDueOnly = dueOnly;
      localStorage.setItem(App.config.REVIEW_MODE_KEY, dueOnly ? '1' : '0');
      S.reviewQueue = App.review.buildQueue(dueOnly);
      S.reviewIndex = 0;
      S.reviewFlipped = false;
      App.render.review();
    },

    setMode(dueOnly){
      if(dueOnly === App.state.reviewDueOnly) return;
      App.review.start(dueOnly);
    },

    grade(correct){
      const S = App.state;
      const w = S.reviewQueue[S.reviewIndex];
      const cfg = App.config;
      w.box = correct ? Math.min((w.box || 0) + 1, cfg.SR_MAX_BOX) : 0;
      w.nextReview = Date.now() + cfg.SR_INTERVALS[w.box] * cfg.SR_DAY;
      App.storage.save();

      S.reviewIndex++;
      S.reviewFlipped = false;
      App.render.review();
    }
  },

  // 备份：JSON 导出/导入。选 JSON 不选 CSV，是因为字段能 100% 保真
  // （box/nextReview 这些间隔重复字段也能完整带上），不用处理列名映射。
  backup: {
    pendingImport: null, // { list, newCount, dupCount, skipCount }

    open(){
      App.backup.renderMenu();
      App.dom.backupOverlay.classList.add('show');
      App.dom.backupSheet.classList.add('show');
    },
    close(){
      App.dom.backupOverlay.classList.remove('show');
      App.dom.backupSheet.classList.remove('show');
      App.backup.pendingImport = null;
      App.dom.importFileInput.value = ''; // 允许重复选同一个文件
    },

    renderMenu(){
      const g = App.gist;
      const ic = App.utils.icons;
      const gistDesc = g.isConfigured()
        ? (g.status || '已配置，改动会自动同步')
        : '还没配置，点这里设置';
      App.dom.backupBody.innerHTML = `
        <div class="backup-row" id="exportRow">
          <span class="bk-icon">${ic.download}</span>
          <div class="bk-text">
            <div class="bk-title">导出备份</div>
            <div class="bk-desc">把当前所有单词存成一个 JSON 文件</div>
          </div>
        </div>
        <div class="backup-row" id="importRow">
          <span class="bk-icon">${ic.upload}</span>
          <div class="bk-text">
            <div class="bk-title">导入备份</div>
            <div class="bk-desc">从之前导出的 JSON 文件恢复</div>
          </div>
        </div>
        <div class="backup-row" id="gistRow">
          <span class="bk-icon">${ic.cloud}</span>
          <div class="bk-text">
            <div class="bk-title">云同步</div>
            <div class="bk-desc" id="gistMenuDesc">${gistDesc}</div>
          </div>
        </div>`;
      document.getElementById('exportRow').onclick = App.backup.exportJson;
      document.getElementById('importRow').onclick = ()=>App.dom.importFileInput.click();
      document.getElementById('gistRow').onclick = ()=>App.gist.openSettings();
    },

    exportJson(){
      const data = JSON.stringify(App.state.words, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'grain-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      App.utils.toast('已导出');
      App.backup.close();
    },

    handleFile(e){
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        let raw;
        try{
          raw = JSON.parse(ev.target.result);
        }catch(err){
          App.utils.toast('文件不是合法的 JSON');
          return;
        }
        if(!Array.isArray(raw)){
          App.utils.toast('文件格式不对，应该是一个单词数组');
          return;
        }

        const existingSet = new Set(App.state.words.map(w => (w.word||'').toLowerCase() + '|' + (w.meaning||'').trim()));
        let newCount = 0, dupCount = 0, skipCount = 0;
        const list = [];
        raw.forEach(item=>{
          if(!item || !item.word || !item.meaning){ skipCount++; return; }
          const key = String(item.word).toLowerCase() + '|' + String(item.meaning).trim();
          const isDup = existingSet.has(key);
          if(isDup) dupCount++; else newCount++;
          list.push({
            id: item.id || App.utils.uid(),
            word: item.word, meaning: item.meaning,
            example: item.example || '', exampleZh: item.exampleZh || '',
            phonetic: item.phonetic || '', pos: item.pos || '',
            tag: item.tag || '', scene: item.scene || '', domain: item.domain || '',
            related: item.related || '',
            status: item.status || 1,
            date: item.date || new Date().toISOString().slice(0,10),
            box: typeof item.box === 'number' ? item.box : 0,
            nextReview: item.nextReview || Date.now(),
            createdAt: item.createdAt || Date.now(),
            _isDup: isDup
          });
        });

        App.backup.pendingImport = { list, newCount, dupCount, skipCount };
        App.backup.renderConfirm();
      };
      reader.readAsText(file, 'UTF-8');
    },

    renderConfirm(){
      const p = App.backup.pendingImport;
      App.dom.backupBody.innerHTML = `
        <button class="sheet-back" id="backupBackBtn">${App.utils.icons.chevronLeft}<span>返回</span></button>
        <div class="sheet-title">确认导入</div>
        <div class="backup-stats">
          <div><strong>${p.newCount}</strong> 条新单词</div>
          <div><strong>${p.dupCount}</strong> 条与现有重复</div>
          ${p.skipCount ? `<div><strong>${p.skipCount}</strong> 条跳过（缺单词或释义）</div>` : ''}
        </div>
        <div class="sheet-actions" style="flex-direction:column;">
          <button class="btn btn-primary" id="mergeBtn">合并导入（跳过重复）</button>
          <button class="btn" id="overwriteBtn" style="background:var(--danger-soft);color:var(--danger);">覆盖导入（替换全部现有数据）</button>
        </div>`;
      document.getElementById('mergeBtn').onclick = ()=>App.backup.applyImport('merge');
      document.getElementById('overwriteBtn').onclick = ()=>App.backup.applyImport('overwrite');
      document.getElementById('backupBackBtn').onclick = ()=>{
        App.backup.pendingImport = null;
        App.dom.importFileInput.value = '';
        App.backup.renderMenu();
      };
    },

    applyImport(mode){
      const p = App.backup.pendingImport;
      if(!p) return;
      if(mode === 'overwrite'){
        App.state.words = p.list.map(w=>{ const c={...w}; delete c._isDup; return c; });
      } else {
        const toAdd = p.list.filter(w=>!w._isDup).map(w=>{ const c={...w}; delete c._isDup; return c; });
        App.state.words = App.state.words.concat(toAdd);
      }
      App.storage.save();
      App.utils.toast(mode === 'overwrite' ? '已覆盖导入' : `已合并导入 ${p.newCount} 条`);
      App.backup.close();
      App.render.main();
    }
  },

  // 云同步：GitHub Gist。跟 Words.html 用的是同一个 GitHub Token，
  // 但 Gist 是 Grain 专属的新建 Gist，跟 Words.html 各用各的文件，
  // 避免共用一个 Gist 时，对方一推送就让这边误判"云端冲突"。
  gist: {
    config: {
      FILENAME: 'grain-words.json',
      TOKEN_KEY: 'grain_gist_token',
      GIST_ID_KEY: 'grain_gist_id',
      KNOWN_VERSION_KEY: 'grain_gist_known_version',
      PUSH_DEBOUNCE_MS: 8000,   // 改动之后等这么久没有新改动，才真正推送，避免连续编辑时狂发请求
      PUSH_MIN_INTERVAL_MS: 10000
    },
    status: '',
    _busy: false,
    _lastPush: 0,
    _pushTimer: null,

    isConfigured(){
      return !!(localStorage.getItem(App.gist.config.TOKEN_KEY) && localStorage.getItem(App.gist.config.GIST_ID_KEY));
    },

    setStatus(msg){
      App.gist.status = msg;
      const el = document.getElementById('gistStatus');
      if(el) el.textContent = msg;
    },

    openSettings(){
      const cfg = App.gist.config;
      const token = localStorage.getItem(cfg.TOKEN_KEY) || '';
      const gistId = localStorage.getItem(cfg.GIST_ID_KEY) || '';
      App.dom.backupBody.innerHTML = `
        <button class="sheet-back" id="gistBackBtn">${App.utils.icons.chevronLeft}<span>返回</span></button>
        <div class="sheet-title">云同步</div>
        <div class="field"><label>GitHub Token</label><input id="gistTokenInput" type="password" value="${App.utils.escapeHtml(token)}" placeholder="ghp_xxxxxxxx" autocomplete="off"></div>
        <div class="field"><label>Gist ID</label><input id="gistIdInput" value="${App.utils.escapeHtml(gistId)}" placeholder="新建一个空 Gist，把它的 ID 填这里" autocomplete="off"></div>
        <div style="font-size:12px;color:var(--ink-faint);margin:-6px 0 14px;">状态：<span id="gistStatus">${App.utils.escapeHtml(App.gist.status || (App.gist.isConfigured() ? '已配置' : '未配置'))}</span></div>
        <div class="sheet-actions" style="flex-direction:column;">
          <button class="btn btn-primary" id="gistSaveBtn">保存配置</button>
          <div class="sheet-actions" style="margin-top:0;">
            <button class="btn" id="gistPushBtn" style="background:var(--surface-2);color:var(--ink);">立即上传</button>
            <button class="btn" id="gistPullBtn" style="background:var(--surface-2);color:var(--ink);">立即下载</button>
          </div>
        </div>`;
      document.getElementById('gistSaveBtn').onclick = App.gist.saveConfig;
      document.getElementById('gistPushBtn').onclick = ()=>App.gist.push(true);
      document.getElementById('gistPullBtn').onclick = ()=>App.gist.pull(true);
      document.getElementById('gistBackBtn').onclick = ()=>App.backup.renderMenu();
    },

    saveConfig(){
      const cfg = App.gist.config;
      const token = document.getElementById('gistTokenInput').value.trim();
      const gistId = document.getElementById('gistIdInput').value.trim();
      if(!token || !gistId){
        App.utils.toast('Token 和 Gist ID 都要填');
        return;
      }
      localStorage.setItem(cfg.TOKEN_KEY, token);
      localStorage.setItem(cfg.GIST_ID_KEY, gistId);
      App.utils.toast('已保存');
      App.gist.setStatus('已配置');
    },

    buildContent(){
      return JSON.stringify(App.state.words, null, 2);
    },

    // 改动数据后调用：防抖等待，安静地（非手动）推一次
    scheduleAutoPush(){
      if(!App.gist.isConfigured()) return;
      clearTimeout(App.gist._pushTimer);
      App.gist._pushTimer = setTimeout(()=>App.gist.push(false), App.gist.config.PUSH_DEBOUNCE_MS);
    },

    async push(manual){
      const cfg = App.gist.config;
      const token = localStorage.getItem(cfg.TOKEN_KEY);
      const gistId = localStorage.getItem(cfg.GIST_ID_KEY);
      if(!token || !gistId){ if(manual) App.utils.toast('先配置 Token 和 Gist ID'); return; }
      if(App.gist._busy){ if(manual) App.utils.toast('同步进行中，稍等'); return; }
      if(!manual && (Date.now() - App.gist._lastPush) < cfg.PUSH_MIN_INTERVAL_MS) return;

      App.gist._busy = true;
      if(manual) App.gist.setStatus('检查云端状态…');
      try{
        // 推送前先确认云端没被别的设备改过，避免静默覆盖对方的修改
        const checkRes = await fetch('https://api.github.com/gists/' + gistId, {
          headers: { Authorization: 'token ' + token }
        });
        if(!checkRes.ok) throw new Error('HTTP ' + checkRes.status);
        const remote = await checkRes.json();
        const known = localStorage.getItem(cfg.KNOWN_VERSION_KEY);
        if(known && remote.updated_at && known !== remote.updated_at){
          App.gist._busy = false;
          if(manual) App.gist.setStatus('检测到云端有更新，请先处理冲突');
          App.gist.showConflictBanner();
          return;
        }
        await App.gist._doPush(token, gistId, manual);
      }catch(e){
        if(manual) App.gist.setStatus('检查失败：' + e.message);
      }finally{
        App.gist._busy = false;
      }
    },

    async _doPush(token, gistId, manual){
      const cfg = App.gist.config;
      try{
        const res = await fetch('https://api.github.com/gists/' + gistId, {
          method: 'PATCH',
          headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: { [cfg.FILENAME]: { content: App.gist.buildContent() } } })
        });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        App.gist._lastPush = Date.now();
        if(data.updated_at) localStorage.setItem(cfg.KNOWN_VERSION_KEY, data.updated_at);
        if(manual) App.gist.setStatus('上传成功 ✓ ' + new Date().toLocaleTimeString());
      }catch(e){
        if(manual) App.gist.setStatus('上传失败：' + e.message);
      }
    },

    async pull(manual){
      const cfg = App.gist.config;
      const token = localStorage.getItem(cfg.TOKEN_KEY);
      const gistId = localStorage.getItem(cfg.GIST_ID_KEY);
      if(!token || !gistId){ if(manual) App.utils.toast('先配置 Token 和 Gist ID'); return; }
      if(manual) App.gist.setStatus('下载中…');
      try{
        const res = await fetch('https://api.github.com/gists/' + gistId, {
          headers: { Authorization: 'token ' + token }
        });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const file = data.files && data.files[cfg.FILENAME];
        if(!file){
          if(manual) App.gist.setStatus('Gist 里还没有 Grain 的数据文件，先上传一次');
          return;
        }
        const content = JSON.parse(file.content);
        if(Array.isArray(content)){
          App.state.words = content;
          App.storage.save({ skipAutoPush: true }); // 拉下来的数据不用再推回去
        }
        if(data.updated_at) localStorage.setItem(cfg.KNOWN_VERSION_KEY, data.updated_at);
        if(manual) App.gist.setStatus('下载成功 ✓ ' + new Date().toLocaleTimeString());
        App.render.main();
      }catch(e){
        if(manual) App.gist.setStatus('下载失败：' + e.message);
      }
    },

    // 冲突提示条：跟"添加/备份"那两个 sheet 是独立的浮层，不管当前在哪个页面都能弹出来
    showConflictBanner(){
      if(document.getElementById('gistConflictBanner')) return;
      const banner = document.createElement('div');
      banner.id = 'gistConflictBanner';
      banner.className = 'conflict-banner';
      banner.innerHTML = `
        <div style="margin-bottom:10px;">⚠️ 检测到云端有更新（可能来自其他设备），是否用本地数据覆盖云端？</div>
        <div style="display:flex;gap:8px;">
          <button id="cfOverwrite" style="flex:1;padding:8px 4px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">覆盖云端</button>
          <button id="cfPull" style="flex:1;padding:8px 4px;background:var(--surface-2);color:var(--ink);border:none;border-radius:6px;font-size:12px;cursor:pointer;">改用云端数据</button>
          <button id="cfDismiss" style="flex:1;padding:8px 4px;background:var(--surface-2);color:var(--ink-soft);border:none;border-radius:6px;font-size:12px;cursor:pointer;">稍后再说</button>
        </div>`;
      document.body.appendChild(banner);
      document.getElementById('cfOverwrite').onclick = ()=>App.gist.resolveConflict('overwrite');
      document.getElementById('cfPull').onclick = ()=>App.gist.resolveConflict('pull');
      document.getElementById('cfDismiss').onclick = ()=>App.gist.resolveConflict('dismiss');
    },

    resolveConflict(action){
      const banner = document.getElementById('gistConflictBanner');
      if(banner) banner.remove();
      if(action === 'overwrite'){
        const cfg = App.gist.config;
        App.gist._busy = true;
        App.gist._doPush(localStorage.getItem(cfg.TOKEN_KEY), localStorage.getItem(cfg.GIST_ID_KEY), true)
          .finally(()=>{ App.gist._busy = false; });
      } else if(action === 'pull'){
        App.gist.pull(true);
      }
      // dismiss：本地改动先留着，下次自动推送时会重新检测
    }
  },

  sheet: {
    openAdd(){
      const S = App.state;
      S.editingId = null;
      App.dom.sheetTitle.textContent = '添加单词';
      App.dom.deleteBtn.style.display = 'none';
      ['fWord','fMeaning','fExample','fPhonetic','fPos','fExampleZh','fTag','fScene','fDomain','fRelated']
        .forEach(id=>document.getElementById(id).value = '');
      document.getElementById('fStatus').value = '1';
      document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
      App.dom.moreFields.classList.remove('open');
      App.dom.moreToggle.classList.remove('open');
      App.sheet.show();
      setTimeout(()=>document.getElementById('fWord').focus(), 300);
    },

    openEdit(id){
      const S = App.state;
      const w = S.words.find(x=>x.id === id);
      if(!w) return;
      S.editingId = id;
      App.dom.sheetTitle.textContent = '编辑单词';
      App.dom.deleteBtn.style.display = 'block';

      document.getElementById('fWord').value = w.word || '';
      document.getElementById('fMeaning').value = w.meaning || '';
      document.getElementById('fExample').value = w.example || '';
      document.getElementById('fPhonetic').value = w.phonetic || '';
      document.getElementById('fPos').value = w.pos || '';
      document.getElementById('fExampleZh').value = w.exampleZh || '';
      document.getElementById('fTag').value = w.tag || '';
      document.getElementById('fScene').value = w.scene || '';
      document.getElementById('fDomain').value = w.domain || '';
      document.getElementById('fRelated').value = w.related || '';
      document.getElementById('fStatus').value = String(w.status || 1);
      document.getElementById('fDate').value = w.date || new Date().toISOString().slice(0,10);

      const hasMore = !!(w.phonetic || w.pos || w.exampleZh || w.tag || w.scene || w.domain || w.related);
      App.dom.moreFields.classList.toggle('open', hasMore);
      App.dom.moreToggle.classList.toggle('open', hasMore);

      App.sheet.show();
    },

    show(){
      App.dom.sheetOverlay.classList.add('show');
      App.dom.sheet.classList.add('show');
    },
    close(){
      App.dom.sheetOverlay.classList.remove('show');
      App.dom.sheet.classList.remove('show');
    },

    save(){
      const S = App.state;
      const word = document.getElementById('fWord').value.trim();
      const meaning = document.getElementById('fMeaning').value.trim();
      if(!word || !meaning){
        App.utils.toast('单词和释义都要填哦');
        return;
      }

      const existing = S.editingId ? S.words.find(x=>x.id === S.editingId) : null;

      const data = {
        id: S.editingId || App.utils.uid(),
        word, meaning,
        example: document.getElementById('fExample').value.trim(),
        phonetic: document.getElementById('fPhonetic').value.trim(),
        pos: document.getElementById('fPos').value.trim(),
        exampleZh: document.getElementById('fExampleZh').value.trim(),
        tag: document.getElementById('fTag').value.trim(),
        scene: document.getElementById('fScene').value.trim(),
        domain: document.getElementById('fDomain').value.trim(),
        related: document.getElementById('fRelated').value.trim(),
        status: parseInt(document.getElementById('fStatus').value, 10),
        date: document.getElementById('fDate').value,
        // 间隔重复调度字段：编辑时保留原有进度，新词从今天开始
        box: existing ? existing.box : 0,
        nextReview: existing ? existing.nextReview : Date.now(),
        createdAt: existing ? existing.createdAt : Date.now()
      };

      if(existing){
        Object.assign(existing, data);
        App.utils.toast('已保存');
      } else {
        S.words.push(data);
        App.utils.toast('已添加');
      }
      App.storage.save();
      App.sheet.close();
      App.render.main();
    },

    delete(){
      const S = App.state;
      if(!S.editingId) return;
      if(!confirm('确定删除这个单词吗？')) return;
      S.words = S.words.filter(w=>w.id !== S.editingId);
      App.storage.save();
      App.sheet.close();
      App.render.main();
    }
  },

  init(){
    this.dom = {
      main: document.getElementById('main'),
      headerCount: document.getElementById('headerCount'),
      toast: document.getElementById('toast'),
      sheet: document.getElementById('sheet'),
      sheetOverlay: document.getElementById('sheetOverlay'),
      sheetTitle: document.getElementById('sheetTitle'),
      moreToggle: document.getElementById('moreToggle'),
      moreFields: document.getElementById('moreFields'),
      deleteBtn: document.getElementById('deleteBtn'),
      saveBtn: document.getElementById('saveBtn'),
      fabAdd: document.getElementById('fabAdd'),
      settingsBtn: document.getElementById('settingsBtn'),
      backupSheet: document.getElementById('backupSheet'),
      backupOverlay: document.getElementById('backupOverlay'),
      backupBody: document.getElementById('backupBody'),
      importFileInput: document.getElementById('importFileInput')
    };

    this.dom.fabAdd.onclick = ()=>this.sheet.openAdd();
    this.dom.sheetOverlay.onclick = ()=>this.sheet.close();
    this.dom.saveBtn.onclick = ()=>this.sheet.save();
    this.dom.deleteBtn.onclick = ()=>this.sheet.delete();
    this.dom.moreToggle.onclick = ()=>{
      this.dom.moreFields.classList.toggle('open');
      this.dom.moreToggle.classList.toggle('open');
    };

    this.dom.settingsBtn.onclick = ()=>this.backup.open();
    this.dom.backupOverlay.onclick = ()=>this.backup.close();
    this.dom.importFileInput.onchange = (e)=>this.backup.handleFile(e);

    document.querySelectorAll('.nav-btn').forEach(btn=>{
      btn.onclick = ()=>{
        this.state.currentTab = btn.dataset.tab;
        this.render.syncNav();
        if(btn.dataset.tab === 'review'){
          this.review.start(this.state.reviewDueOnly);
        } else {
          this.render.main();
        }
      };
    });

    // 恢复上次选的"今日复习/全部单词"偏好
    this.state.reviewDueOnly = localStorage.getItem(this.config.REVIEW_MODE_KEY) !== '0';

    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
      });
    }

    this.storage.load();
    this.render.main();

    // 启动时如果配置了云同步，静默拉一次最新数据
    if(this.gist.isConfigured()) this.gist.pull(false);
  }
};

App.init();
window.App = App; // 方便控制台调试
</script>
</body>
</html>
